name: Build and Deploy

on:
  push:
    branches:
      - master
  # Lyric videos go public Mondays at 6:00 am Central. 12:30 UTC is 6:30 am
  # CST or 7:30 am CDT.
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        # If you're using actions/checkout@v2 you must set persist-credentials to false
        # in most cases for the deployment to work correctly.
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Release lyric videos
        if: github.event_name != 'push'
        run: npm run release-videos

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Commits made with GITHUB_TOKEN do not trigger another run, so this
      # same run deploys the change below.
      - name: Commit released videos
        if: github.event_name != 'push'
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release lyric videos"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:master

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages # The branch the action should deploy to.
          folder: dist # The folder the action should deploy.
          single-commit: true
