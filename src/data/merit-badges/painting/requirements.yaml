# Requirement 8 is not the same as other merit badges. Suggested wording: Find
# out about three career opportunities in painting. Pick one that might
# interest you and find out the training, certifications, and experience
# required for this profession and discuss this with your counselor. Tell why
# this profession interests you.
-   requirement: 1
    text: |-
        Explain the proper safety procedures to follow when preparing surfaces
        and applying coatings.
    resources:
        -   href: https://youtu.be/PPbD206cNKA
            text: Best Safety Equipment for Painting
            type: video
        -   href: https://youtu.be/HWdws9vQ0J4
            text: PPE for Interior Painting
            type: video
-   requirement: 2
    text: 'Do the following:'
    children:
        -   requirement: a
            text: Explain three ways that coatings can improve a surface.
            resources:
                -   href: https://www.youtube.com/watch?v=A-ERekKoohI
                    text: Epoxy Resin Coatings
                    type: video
        -   requirement: b
            text: |-
                Explain the differences between oil-based paints, acrylic-based
                paints, and water-based paints.
            resources:
                -   href: https://www.youtube.com/watch?v=jEyTpUfbrYA
                    text: Paints - Oil, Water, Enamel, Acrylic
                    type: video
                -   href: https://www.youtube.com/watch?v=T99OFHCLF4s
                    text: Water vs Oil Based Paints
                    type: video
        -   requirement: c
            text: |-
                Explain where you would apply enamel paint, flat paint, wood
                stain, and varnish, and explain the importance of sheen.
            resources:
                -   href: https://www.youtube.com/watch?v=DyKh80Yt9k0
                    text: Paint Sheen Differences Explained
                    type: video
        -   requirement: d
            text: Tell why each is best for these uses.
-   requirement: 3
    text: |-
        Prepare and paint two different surfaces using patching materials or
        caulking and the proper primers and topcoats. Suggested projects include
        an interior or exterior wall, a door, a piece of furniture, a concrete
        wall or floor, a porch rail, or a fence. Your counselor must preapprove
        the projects.
    resources:
        -   href: https://youtu.be/b0QcTu-5D1I
            text: How To Paint an Exterior Metal Door
            type: video
-   requirement: 4
    text: |-
        Prepare and paint an item using harmonizing colors that you have
        selected using the color wheel in the <a
        href="/merit-badges/painting/"><i>Painting</i> merit badge</a> pamphlet.
    resources:
        -   href: https://youtu.be/672JGEhg8vM
            text: Decorating With a Color Scheme
            type: video
        -   href: https://filestore.scouting.org/filestore/Merit_Badge_ReqandRes/Requirement%20Resources/Painting/Painting_Color%20Wheet%20from%202025%20MBP.pdf
            text: Color Wheel from Painting Merit Badge Pamphlet
            type: pdf
-   requirement: 5
    text: |-
        Show the right way to use, clean, maintain, and store painting
        equipment.
    resources:
        -   href: https://youtu.be/H9kbYbWd3AA
            text: How To Clean Paint Brushes
            type: video
        -   href: https://youtu.be/ygmP3UBnLLU
            text: How To Use a Paint Sprayer
            type: video
-   requirement: 6
    text: |-
        Explain the importance of ladder safety, personal hygiene, and the use
        of personal protective equipment when painting.
    resources:
        -   href: https://www.homedepot.com/c/ab/ladder-safety-tips/9ba683603be9fa5395fab9017d77401c
            text: Ladder Safety Tips
            type: website
-   requirement: 7
    text: |-
        Explain some of the environmental and health issues concerning removing
        paint, applying paint, and discarding old paint.
    resources:
        -   href: https://www.youtube.com/watch?v=7YKuwlGgWpc
            text: How to Dispose of Old Paint
            type: video
        -   href: https://www.youtube.com/watch?v=8lG6dAZE52k
            text: Paint Removers
            type: video
-   requirement: 8
    text: 'Do ONE of the following:'
    children:
        -   requirement: a
            text: |-
                Explore careers related to this merit badge. Research one career
                to learn about the training and education needed, costs, job
                prospects, salary, job duties, and career advancement. Your
                research methods may include—with your parent or guardian's
                permission—an internet or library search, an interview with a
                professional in the field, or a visit to a location where people
                in this career work. Discuss with your counselor both your
                findings and what about this profession might make it an
                interesting career.
            resources:
                -   href: https://www.youtube.com/watch?v=5glRwgnb5gk
                    text: Painters Career Overview
                    type: video
                -   href: https://www.youtube.com/watch?v=mWjbRoAId_4
                    text: Scenic Painter
                    type: video
                -   href: https://www.bls.gov/ooh/construction-and-extraction/painters-construction-and-maintenance.htm
                    text: Painters
                    type: website w/ video
        -   requirement: b
            text: |-
                Explore how you could use knowledge and skills from this merit
                badge to pursue a hobby or healthy lifestyle. Research any
                training needed, expenses, and organizations that promote or
                support it. Discuss with your counselor what short-term and
                long-term goals you might have if you pursued this.
            resources:
                -   href: https://youtu.be/UpImD3qedKw
                    text: |-
                        Easy Wall Painting DIY I Balcony makeover I Yoga wall
                        art
                    type: video
