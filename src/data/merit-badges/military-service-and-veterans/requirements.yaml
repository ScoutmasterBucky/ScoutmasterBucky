-   requirement: 1
    text: '<b>Explore Military Heritage.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Learn about Robert Baden-Powell's military service. Discuss with
                your counselor what he learned about people, values, and culture
                through his military service and how it influenced the founding
                of Scouting.
            resources:
                -   href: https://oa-scouting.org/history/lord-baden-powell
                    text: Lord Baden-Powell
                    type: website
        -   requirement: b
            text: |-
                Select an historical US military conflict. Discuss with your
                counselor what caused it and how leadership, planning, or values
                affected its outcome, how it was resolved, and discuss what
                lessons can be learned from it.
            resources:
                -   href: https://department.va.gov/americas-wars/
                    text: America's Wars
                    type: website
-   requirement: 2
    text: |-
        <b>Understand the Cost of War and the Value of Peace.</b> Do the
        following:
    children:
        -   requirement: a
            text: |-
                Discuss with your counselor why military conflict should be a
                last resort.
        -   requirement: b
            text: 'Do ONE of the following:'
            children:
                -   requirement: 1
                    text: |-
                        Read or listen to President Dwight D. Eisenhower's
                        "Atoms for Peace" speech and explain the objectives and
                        role of the International Atomic Energy Agency (IAEA) in
                        promoting peaceful uses of nuclear energy.
                    resources:
                        -   href: https://youtu.be/2DxeLeginUQ
                            text: Atoms For Peace Speech Eisenhower
                            type: video
                        -   href: https://www.eisenhowerlibrary.gov/research/online-documents/atoms-peace
                            text: Atoms for Peace Overview
                            type: website
                        -   href: https://www.iaea.org/
                            text: International Atomic Energy Agency
                            type: website
                -   requirement: 2
                    text: |-
                        Explain the role of the United Nations in promoting
                        peace and resolving international disputes.
                    resources:
                        -   href: https://peacekeeping.un.org/en
                            text: United Nations Peacekeeping
                            type: website
                -   requirement: 3
                    text: |-
                        Reflect on the human and societal costs of war and share
                        the lessons that can be learned from major conflicts.
                    resources:
                        -   href: https://www.un.org/en/peaceandsecurity/how-conflict-impacts-our-environment
                            text: How Conflict Impacts Our Environment (website)
                            type: website
                        -   href: https://www.dday.center/the-impact-of-wwii-on-european-cities-and-infrastructure/
                            text: |-
                                The Impact of WWII on European Cities and
                                Infrastructure Explained
                            type: website
-   requirement: 3
    text: '<b>United States Armed Forces.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Choose one of the branches of service of the United States and
                research its history, its mission, and its organization. Explain
                to your counselor what you learned.
            resources:
                -   href: https://www.usa.gov/us-military
                    text: Learn About the U.S. Military Branches
                    type: website
        -   requirement: b
            text: 'Do ONE of the following:'
            children:
                -   requirement: 1
                    text: |-
                        Learn about the Veterans History Project organized by
                        the Library of Congress. Conduct and record an interview
                        of a Veteran using those guidelines. Share your
                        recording with your counselor and the Veteran. With the
                        Veteran's permission, share it with the Library of
                        Congress.
                    resources:
                        -   href: https://www.loc.gov/programs/veterans-history-project/how-to-participate/customized-guidance/
                            text: |-
                                Veterans History Project Youth Participation and
                                Guidelines
                            type: website
                -   requirement: 2
                    text: |-
                        Select five different conflicts from the Veterans
                        History Project database. Choose a Veteran from each of
                        those five conflicts and study their personal histories.
                    resources:
                        -   href: https://youtu.be/Y-zMq13vKiY
                            text: |-
                                Library of Congress Project Aims To Save
                                Veterans' Stories
                            type: video
-   requirement: 4
    text: '<b>Understand Military Recognition.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Explain the history and significance of the Medal of Honor and
                the Purple Heart.
            resources:
                -   href: https://youtu.be/3ZwXgTnH854
                    text: 'Medal of Honor: In Their Own Words'
                    type: video
                -   href: https://www.cem.va.gov/history/Medal-of-Honor-history.asp
                    text: Medal of Honor History &amp; Recipients
                    type: website
                -   href: https://youtu.be/XoS_PVjLxus
                    text: The Origin of the Purple Heart Medal
                    type: video
                -   href: https://www.nationalww2museum.org/war/articles/history-of-the-purple-heart
                    text: The History of the Purple Heart
                    type: website
        -   requirement: b
            text: Describe the qualifications for receiving each award.
            resources:
                -   href: https://www.cmohs.org/news-events/blog/how-is-the-medal-of-honor-awarded/#:~:text=Criteria%20to%20Earn%20the%20Medal,enemy%20of%20the%20United%20States%3B
                    text: How Is the Medal of Honor Awarded?
                    type: website
        -   requirement: c
            text: |-
                Research a Medal of Honor recipient and share their story with
                your counselor. Explain why their actions were recognized.
            resources:
                -   href: https://youtu.be/M_t1_fzFSOI
                    text: Famous American Medal of Honor Recipients
                    type: video
                -   href: https://www.cmohs.org/recipients
                    text: Medal of Honor Recipients
                    type: website
-   requirement: 5
    text: '<b>Military Uniforms and Insignia.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Learn about the purpose and history of military uniforms and
                insignia.
            resources:
                -   href: https://www.militaryonesource.mil/military-basics/extended-family-friend/the-basics-of-military-uniforms/
                    text: The Basics of Military Uniforms
                    type: website
        -   requirement: b
            text: |-
                Identify the different uniforms worn by members of the U.S.
                Army, Navy, Marine Corps, Air Force, Space Force, and Coast
                Guard.
            resources:
                -   href: https://youtu.be/XbTc8ZSsjm0
                    text: Which US Military Branch Has the COOLEST Uniform?
                    type: video
        -   requirement: c
            text: |-
                Learn to identify and describe the rank insignia for all
                enlisted and officer ranks from one branch of the U.S. Armed
                Forces.
            resources:
                -   href: https://www.war.gov/Resources/Insignias/#officer-insignia
                    text: U.S. Military Rank Insignia
                    type: website
        -   requirement: d
            text: |-
                Explain how rank and insignia show respect, order, and
                responsibility within the military.
-   requirement: 6
    text: '<b>Reflect on Symbols of Service.</b> Do the following:'
    resources:
        -   href: https://youtu.be/MLwa9oAqcVE
            text: What Does the American Flag Mean to You?
            type: video
    children:
        -   requirement: a
            text: |-
                Discuss with an Active-duty Member, Reservist, Guardsmen, or
                Veteran what their uniform and the American Flag mean to them as
                a military member. Share what you learned with your counselor.
                Describe what proper respect for the flag means to them.
        -   requirement: b
            text: |-
                Discuss with your counselor what your uniform and troop flag
                mean to you.
-   requirement: 7
    text: '<b>Honor Veterans.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Participate in a Veterans Day, Memorial Day, or other event that
                honors Veterans in your community, school, or place of worship.
            resources:
                -   href: https://createthegood.aarp.org/volunteer-ideas/memorial-day-help-veterans.html
                    text: Honor Fallen Veterans This Memorial Day
                    type: website
                -   href: https://youtu.be/mWD4Oy6fKlo
                    text: 'Bet You Didn''t Know: Veterans Day | History'
                    type: video
                -   href: https://department.va.gov/veterans-day/history-of-veterans-day/
                    text: History of Veterans Day
                    type: website
                -   href: https://youtu.be/4VLHEZ6ZUxE
                    text: |-
                        Memorial Day Tribute: May We Never Forget Freedom Isn't
                        Free
                    type: video
        -   requirement: b
            text: |-
                Discuss with your counselor what role you played and what you
                learned from the experience.
        -   requirement: c
            text: |-
                Visit a Veterans' organization, military museum, memorial, or
                cemetery. Discuss with your counselor what you learned about
                service, sacrifice, and remembrance.
            resources:
                -   href: https://www.va.gov/opa/docs/remediation-required/veo/traditionalVeteranOrganizations.pdf
                    text: Veterans Service Organizations
                    type: pdf
                -   href: https://vetsmuseum.org/learn-more/military-museums/
                    text: Military Museums
                    type: website
                -   href: https://rememberingveterans.org/veterans-memorials-locator/
                    text: Veterans Memorials
                    type: website
                -   href: https://www.cem.va.gov/find-cemetery/
                    text: Find a Cemetary
                    type: website
-   requirement: 8
    text: '<b>Military Academies.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Learn about the purpose and history of TWO of the U.S. military
                academies. Discuss what you learned with your counselor.
        -   requirement: b
            text: |-
                Explain the general requirements for admission to one of these
                academies.
            resources:
                -   href: https://www.whitehouse.gov/service-academy-nomination/
                    text: Service Academy Nomination Process
                    type: website
        -   requirement: c
            text: |-
                Describe how attending a service academy prepares a person for
                military leadership and service to the nation.
            resources:
                -   href: https://youtu.be/FMGzUJnXssI
                    text: 'The Five-Pointed Star: U.S. Service Academies'
                    type: video
        -   requirement: d
            text: |-
                Discuss with your counselor how the values of Scouting align
                with those of the military academies.
            resources:
                -   href: https://youtu.be/geMiyyQnXC4
                    text: The Honor Concept
                    type: video
-   requirement: 9
    text: '<b>Inspire Service and Leadership.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Discuss how learning about Veteran and military service can
                inspire youth to serve their community and country.
            resources:
                -   href: https://youtu.be/ZffcUB1ZlxM
                    text: |-
                        Scoutmaster Talks About How Military Life Affects
                        Scouting
                    type: video
                -   href: https://ucnet.universityofcalifornia.edu/wp-content/uploads/working-at-uc/your-career/veterans/_files/21_Strengths_Arising_From_Military_Experience.pdf
                    text: 21 Strengths Arising From Military Experience
                    type: pdf
        -   requirement: b
            text: |-
                List two ways you can demonstrate courage, service, or
                leadership in your daily life.
            resources:
                -   href: https://www.colorado.edu/orientation/2024/02/29/6-ways-students-can-demonstrate-leadership
                    text: 6 Ways Students Can Demonstrate Leadership
                    type: website
        -   requirement: c
            text: |-
                Research service projects in your area that honor Veterans or
                support those currently serving. Share what you learned with
                your counselor.
            resources:
                -   href: https://youtu.be/fMZbL0MjEB4
                    text: Quilts of Valor
                    type: video
                -   href: https://www.dav.org/get-involved/volunteer/volunteer-locally-to-help-veterans/
                    text: Volunteer To Help Veterans
                    type: website w/ video
-   requirement: 10
    text: '<b>Careers/Hobby.</b> Do ONE of the following:'
    children:
        -   requirement: a
            text: |-
                Explore careers related to this merit badge. Research one career
                to learn about the training and education needed, costs, job
                prospects, salary, job duties, and career advancement. Your
                research methods may include—with your parent or guardian's
                permission—an internet or library search, an interview with a
                professional in the field, or a visit to a location where people
                in this career work. Discuss with your counselor both your
                findings and what about this profession might make it an
                interesting career.
            resources:
                -   href: https://youtu.be/0Ewqo-_4Cpw
                    text: Air Force Jobs
                    type: video
                -   href: https://youtu.be/aWArkLWjN6U
                    text: These Military Jobs Lead to $100K+ Civilian Careers
                    type: video
                -   href: https://youtu.be/qwnzElkiiCs
                    text: Top 5 Paying Army Jobs for Civilian Careers!
                    type: video
        -   requirement: b
            text: |-
                Explore how you could use knowledge and skills from this merit
                badge to pursue a hobby or volunteer activity, or healthy
                lifestyle. Research any training needed, expenses, and
                organizations that promote or support it. Discuss with your
                counselor what short-term and long-term goals you might have if
                you pursued this.
            resources:
                -   href: https://youtu.be/lO1XXV97lII
                    text: US Coast Guard Auxilliary
                    type: video
                -   href: https://youtu.be/O8onxUMqrsw
                    text: Civil Air Patrol
                    type: video
                -   href: https://youtu.be/wKN3qOHH0OM
                    text: JROTC
                    type: video
                -   href: https://youtu.be/9E7GLdYhm3s
                    text: Honor Flights
                    type: video
                -   href: https://youtu.be/xeTad9uhO0k
                    text: Toy Soldier Collection
                    type: video
                -   href: https://youtu.be/sp5mqqgOqLI
                    text: American Legion Youth Programs
                    type: video
                -   href: https://youtu.be/dGD__hEQp5g
                    text: Building Your First Scale Model Figure!
                    type: video
                -   href: https://youtu.be/hbbHHo53yQ0
                    text: Ham Radio
                    type: video
