-   requirement: 1
    text: 'Do the following:'
    children:
        -   requirement: a
            text: |-
                Explain to your counselor the most likely hazards associated
                with gardening and what you should do to anticipate, help
                prevent, mitigate, and respond to these hazards.
            resources:
                -   href: https://youtu.be/SgddPiUf61A
                    text: Garden Safety Tips
                    type: video
        -   requirement: b
            text: |-
                Discuss the prevention of and treatment for health concerns that
                could occur while gardening, including cuts, scratches, puncture
                wounds, insect bites, anaphylactic shock, heat reactions, and
                reactions from exposure to pesticides and fertilizers.
            resources:
                -   href: https://youtu.be/fMidlx7VB0A
                    text: Pesticide Safety
                    type: video
-   requirement: 2
    text: |-
        Do the following, and discuss your observations throughout the process
        with your counselor:
    children:
        -   requirement: a
            text: |-
                Grow six vegetables, three from seeds and three from seedlings,
                through harvest.
            resources:
                -   href: https://youtube.com/shorts/7lZjUM__0lg
                    text: How To Start Seeds at Home
                    type: video
                -   href: https://youtu.be/BFhUmQyL4Bo
                    text: How To Grow Cucumbers
                    type: video
                -   href: https://youtu.be/RowLz52q8Og
                    text: How To Grow Asparagus
                    type: video
        -   requirement: b
            text: |-
                Grow six flowers, three from seeds and three from seedlings,
                through flowering.
            resources:
                -   href: https://youtu.be/P82I3knYoqY
                    text: How To Plant Flowers
                    type: video
                -   href: https://youtu.be/Yv0MPxzFCvs
                    text: How To Plant &amp; Grow Sunflowers
                    type: video
-   requirement: 3
    text: 'Give the nutritional value of the following:'
    children:
        -   requirement: a
            text: Three root or tuber crops
            resources:
                -   href: https://youtu.be/0VjgXZBKfuQ
                    text: Taro
                    type: video
                -   href: https://youtu.be/o7ZwuSd8KRg
                    text: Sweet Potatoes
                    type: video
                -   href: https://youtu.be/3qCh8KZw_e0
                    text: Potatoes
                    type: video
        -   requirement: b
            text: Three vegetables that bear above the ground
            resources:
                -   href: https://youtu.be/kzX-0rUbkOo
                    text: Lettuce
                    type: video
                -   href: https://youtu.be/M4T3bGDEyHY
                    text: Tomato Health Benefits!
                    type: video
                -   href: https://youtu.be/MVXr7HEMQMU
                    text: Cucumbers
                    type: video
        -   requirement: c
            text: Three fruits
            resources:
                -   href: https://youtu.be/SIDYB6e0Kxc
                    text: Are Green Grapes Good for You? See 6 Reasons
                    type: video
                -   href: https://youtu.be/0yEPKXlYQqQ
                    text: Apples
                    type: video
                -   href: https://youtu.be/DkxhGscNC18&t=1
                    text: Oranges
                    type: video
-   requirement: 4
    text: |-
        Test 100 seeds for germination. Determine the percentage of seeds that
        germinate. Explain why you think some did not germinate.
    resources:
        -   href: https://youtu.be/E0jzPVGiKHs
            text: Seed Germination Test
            type: video
-   requirement: 5
    text: |-
        Visit your county extension office, local university, agricultural
        college, nursery, farm, botanical garden, or arboretum. Report on what
        you learned.
    resources:
        -   href: https://youtu.be/zMB6lTyXdnE
            text: Eyes on Agriculture
            type: video
-   requirement: 6
    text: |-
        Explain to your counselor how and why honeybees are used in pollinating
        food crops and the problems that face the bee population today. Discuss
        what the impact to humanity would be if there were no pollinators.
    resources:
        -   href: https://youtu.be/Kdm9daKTRsc
            text: All About Bees
            type: video
        -   href: https://youtu.be/Jzp6H8BAJ7o
            text: Why Bees Are Important
            type: video
-   requirement: 7
    text: |-
        Identify five garden pests (insects, diseased plants). Recommend two
        solutions for each pest. At least one of the two solutions must be an
        organic method.
    resources:
        -   href: https://youtu.be/6RcI869zno4
            text: Be a Bug Detective
            type: video
        -   href: https://youtu.be/K5hz_B0-LXc
            text: 'Good Bugs vs Bad Bugs: What''s in Your Garden?'
            type: video
-   requirement: 8
    text: |-
        Do ONE of the following and record weekly observations. Discuss the
        results of your project with your counselor.
    children:
        -   requirement: a
            text: Build a compost bin and maintain it for 90 days.
            resources:
                -   href: https://youtu.be/V2eKYvKgTOI
                    text: Build a Compost Bin That Turns Yard Waste Into Soil
                    type: video
        -   requirement: b
            text: |-
                Build a vermicompost bin (worm compost bin) and maintain it for
                90 days.
            resources:
                -   href: https://youtu.be/C31jh3ohFwc
                    text: |-
                        How to Build a Worm Composter: A Simple DIY
                        Vermicomposting Project
                    type: video
        -   requirement: c
            text: |-
                Build a hydroponic garden containing three vegetables or herbs,
                or three ornamental plants. Maintain this garden through harvest
                or flowering, or for 90 days.
            resources:
                -   href: https://youtu.be/LJuh6VGEfPc
                    text: How To Grow an Indoor Hydroponic Garden
                    type: video
                -   href: https://youtu.be/hBzrclNT4PI
                    text: Hydroponics At Home
                    type: video
        -   requirement: d
            text: |-
                Build one water garden, either in a container (at least 12 by 6
                inches and 6 inches deep), or in the ground as a small,
                decorative pond no larger than 6 by 3 feet and 24 inches deep.
                Maintain the water garden for 90 days.
            resources:
                -   href: https://youtu.be/Y2ZL-9hRtLc
                    text: How to Create a Water Garden in a Pot
                    type: video
        -   requirement: e
            text: |-
                Prepare a honey super for use on a hive or colony. Remove a
                filled honey super from the hive or colony and prepare the honey
                for sale.
            resources:
                -   href: https://youtu.be/q9jT2z0a5pA
                    text: Adding a Second Super
                    type: video
                -   href: https://blogs.ifas.ufl.edu/orangeco/2022/11/29/honey-harvesting-honey-out-of-the-hive
                    text: 'Honey Harvesting: Honey out of the Hive'
                    type: website
        -   requirement: f
            text: |-
                Grow a garden of your own using soil from seed or plantings to
                harvest or for 90 days, whichever is earlier. This can be an
                outdoor garden or indoors using appropriate containers, and
                should include at least three types of plants approved by your
                counselor.
            resources:
                -   href: https://youtu.be/zpkz8ckO6Pc
                    text: The Secret to a Garden That Produces All Summer Long
                    type: video
                -   href: https://youtu.be/C6pvLVfEmKk
                    text: How To Get Started Growing Organic Garden
                    type: video
                -   href: https://youtu.be/dTsWMZIEr6M
                    text: How To Have a Weed-Free Garden
                    type: video
-   requirement: 9
    text: 'Do ONE of the following:'
    children:
        -   requirement: a
            text: |-
                Identify three career opportunities that would use skills and
                knowledge in gardening. Pick one and research the training,
                education, certification requirements, experience, and expenses
                associated with entering the field. Research the prospects for
                employment, starting salary, advancement opportunities and
                career goals associated with this career. Discuss what you
                learned with your counselor and whether you might be interested
                in this career.
            resources:
                -   href: https://youtu.be/RVIvWuZ-TUk
                    text: Gardener - Career Spotlight
                    type: video
                -   href: https://www.bls.gov/ooh/building-and-grounds-cleaning/grounds-maintenance-workers.htm
                    text: Grounds Maintenance Workers
                    type: website w/ video
        -   requirement: b
            text: |-
                Identify how you might use the skills and knowledge in gardening
                to pursue a personal hobby and/or healthy lifestyle. Research
                the additional training required, expenses, and affiliation with
                organizations that would help you maximize the enjoyment and
                benefit you might gain from it. Discuss what you learned with
                your counselor and share what short-term and long-term goals you
                might have if you pursued this.
            resources:
                -   href: https://youtu.be/iVecXN-JQ64
                    text: |-
                        Benefits of Gardening as a Hobby and Why You Should Be a
                        Gardener
                    type: video
