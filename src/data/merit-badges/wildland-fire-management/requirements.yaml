-   requirement: 1
    text: |-
        <b>History of Wildland Fire.</b> Research and discuss with your
        counselor the history of wildland fire, its suppression, prevention, and
        management in the United States.
    resources:
        -   href: https://youtu.be/ZnabcDAQ1DU
            text: A History of Wildfire Prevention
            type: video
        -   href: >-
                https://www.nifc.gov/fire-information/fire-prevention-education-mitigation/wildfire-education
            text: Wildfire Education
            type: website
-   requirement: 2
    text: |-
        <b>Harms of Wildfire.</b> Research the harm caused by wildfire in the
        United States, including annual acres burned for the past three years.
        Discuss with your counselor. Include the negative impacts that wildfire
        has on the following:
    resources:
        -   href: https://youtu.be/HeOl2N6iLy0
            text: A Better Way To Think About Wildland Fires
            type: video
        -   href: https://youtu.be/bmX4kxdSi98
            text: Effects of Wildfires and Forest Fires
            type: video
    children:
        -   requirement: a
            text: Commercial forest products
        -   requirement: b
            text: Fish and wildlife habitat
            resources:
                -   href: https://youtu.be/P5EoR12vHcQ
                    text: The Impact of Wildfires on Wildlife
                    type: video
        -   requirement: c
            text: Soil and water
            resources:
                -   href: https://youtu.be/RV_OZ430GAs
                    text: How Wildfires Affect Water Supply
                    type: video
        -   requirement: d
            text: Recreation and public use
        -   requirement: e
            text: Homes, communities, and human resources
        -   requirement: f
            text: Air quality and public health
            resources:
                -   href: https://youtu.be/8mQllQnJrhg
                    text: How Are Wildfires Making Us Sick?
                    type: video
-   requirement: 3
    text: |-
        <b>Fire as a Management Tool.</b> Discuss with your counselor how
        prescribed fire is used to accomplish the following:
    resources:
        -   href: https://youtu.be/vFPIoH4ML2U
            text: Misconceptions and Benefits of Fire
            type: video
    children:
        -   requirement: a
            text: Fuel reduction
            resources:
                -   href: https://youtu.be/E542gY7uR0s
                    text: 'Good Fire: Prescribed Burning'
                    type: video
        -   requirement: b
            text: Fish and wildlife habitat enhancement
            resources:
                -   href: https://youtu.be/Q8mD-4rexo0
                    text: Wildlife That Depends on Fire To Survive
                    type: video
        -   requirement: c
            text: Ecosystem restoration
            resources:
                -   href: https://youtu.be/iKRYDp6VpyA
                    text: How Does Fire Affect Wildlife?
                    type: video
        -   requirement: d
            text: Forest regeneration
            resources:
                -   href: https://youtu.be/BxKh86ukZMc
                    text: Fire Effects in the Forest
                    type: video
        -   requirement: e
            text: Insect and disease control
            resources:
                -   href: https://youtu.be/e_cOMAioE54
                    text: Insects, Disease, Drought, and Fire
                    type: video
-   requirement: 4
    text: |-
        <b>Wildfire Prevention and Mitigation.</b> Discuss the following with
        your counselor:
    children:
        -   requirement: a
            text: 'Wildfire Prevention:'
            resources:
                -   href: https://www.usfa.fema.gov/prevention/fief/
                    text: Fire Is Everyone's Fight
                    type: website
            children:
                -   requirement: 1
                    text: The main causes of wildfire in the United States
                    resources:
                        -   href: https://youtu.be/5hghT1W33cY
                            text: Wildfires 101
                            type: video
                -   requirement: 2
                    text: |-
                        How you can prevent human caused wildfires in your
                        community and on outings with your unit.
                    resources:
                        -   href: https://youtu.be/tUTyDGlJt00
                            text: Wildfire Prevention With Smokey the Bear
                            type: video
        -   requirement: b
            text: 'Wildfire Mitigation:'
            children:
                -   requirement: 1
                    text: Wildland-Urban Interface
                    resources:
                        -   href: >-
                                https://storymaps.arcgis.com/stories/6b2050a0ded0498c863ce30d73460c9e
                            text: Understanding the Wildland Urban Interface
                            type: website
                -   requirement: 2
                    text: |-
                        Defensible space and how homes and communities in the
                        wildland-urban interface can be protected from wildfire
                    resources:
                        -   href: https://youtu.be/isf6COwOXPw
                            text: |-
                                Separating Your Home From Wildfire—the Zones of
                                Defensible Space
                            type: video
-   requirement: 5
    text: '<b>Fire Behavior.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Discuss with your counselor how the fire environment affects
                wildland fire behavior. Include examples of the influences of
                weather, topography, and fuel.
            resources:
                -   href: https://youtu.be/FUdPfKL8lXA
                    text: |-
                        The Relationship Between Relative Humidity, Fuel
                        Moisture, and Fire Behavior
                    type: video
                -   href: https://www.nps.gov/articles/wildland-fire-behavior.htm
                    text: Wildland Fire Behavior
                    type: website
        -   requirement: b
            text: |-
                Explain how a wildfire can be suppressed by removing heat, fuel,
                or oxygen.
            resources:
                -   href: https://youtu.be/8WPk15XqN2E
                    text: Fire Triangle Explained
                    type: video
        -   requirement: c
            text: Draw a diagram to illustrate the parts of a wildfire.
            resources:
                -   href: https://youtu.be/b1KvTswZYNA
                    text: How To Describe the Behavior and Parts of a Wildfire
                    type: video
-   requirement: 6
    text: '<b>Wildland Firefighter Safety.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Discuss with your counselor the personal protective equipment
                used by wildland firefighters and its use.
            resources:
                -   href: https://youtu.be/a0NtIJMDUD4
                    text: Dressed for Fire
                    type: video
        -   requirement: b
            text: |-
                Discuss the following with your counselor, including why each is
                an important consideration for maintaining personal safety and
                situational awareness during wildland fire suppression
                activities:
            children:
                -   requirement: 1
                    text: 10 Standard Firefighting Orders
                    resources:
                        -   href: https://youtu.be/9WhKKSGl9K0
                            text: Standard Firefighting Orders
                            type: video
                -   requirement: 2
                    text: 18 Watch Out Situations
                    resources:
                        -   href: https://youtu.be/GIMeOZ_d1ko
                            text: The Watchout Situations
                            type: video
                -   requirement: 3
                    text: |-
                        Lookouts, Communication, Escape Routes, and Safety Zones
                        (LCES)
                    resources:
                        -   href: https://youtu.be/46kiCPcfUyg
                            text: LCES
                            type: video
-   requirement: 7
    text: '<b>Wildfire Suppression Tactics.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Alone or with a small team, using the diagram you created in
                Requirement 5(c) or a map of a wildfire, and tokens to represent
                firefighting resources, demonstrate the following wildland fire
                suppression tactics. Explain under which conditions each tactic
                would be used:
            resources:
                -   href: https://youtu.be/9EzcA3KvEsY
                    text: How We Fight Wildfires
                    type: video
            children:
                -   requirement: 1
                    text: Direct attack
                    resources:
                        -   href: https://youtu.be/HDmGToDhgV4
                            text: |-
                                Direct and Indirect Attack Strategies on
                                Wildfires
                            type: video
                -   requirement: 2
                    text: Indirect attack
                -   requirement: 3
                    text: Minimum impact suppression tactics
                    resources:
                        -   href: https://youtu.be/W8GHIZAaUaQ
                            text: |-
                                Evolution of Fire Management and the Role of
                                Knowledge
                            type: video
                -   requirement: 4
                    text: Use of hand crews, machinery, and aircraft
                    resources:
                        -   href: https://youtu.be/Dw0wY6SgG2w
                            text: California Battles Fires With "Fire Plane"
                            type: video
                -   requirement: 5
                    text: Mop-up
                    resources:
                        -   href: https://youtu.be/DNFv_cr8r7I
                            text: Mop Up Operations on the Mosquito Fire
                            type: video
                -   requirement: 6
                    text: Repair and restoration
        -   requirement: b
            text: |-
                Draw a diagram of the Incident Command System. Alone or with
                your team, explain the responsibilities of the Command and
                General Staff positions on a wildfire incident.
            resources:
                -   href: >-
                        https://training.fema.gov/emiweb/is/icsresource/assets/ics%20organizational%20structure%20and%20elements.pdf
                    text: ICS Organizational Structure and Elements
                    type: pdf
-   requirement: 8
    text: '<b>Wildfire Suppression Tools.</b> Do the following:'
    children:
        -   requirement: a
            text: |-
                Demonstrate the use of three hand tools unique to wildland fire
                suppression. Use one of these tools to demonstrate how to
                construct a fireline.
            resources:
                -   href: https://youtu.be/SHXLUEfHlxw
                    text: Wildland Firefighting Tools
                    type: video
        -   requirement: b
            text: |-
                Discuss seven other tools, equipment, or apparatus that are
                unique to wildland fire suppression and explain how these
                resources are used.
            resources:
                -   href: https://www.nps.gov/articles/wildland-fire-engines.htm
                    text: Wildland Fire Engines
                    type: website w/ video
                -   href: https://www.nifc.gov/resources/aircraft
                    text: Aircraft
                    type: website
                -   href: https://www.nifc.gov/resources/equipment
                    text: Firefighting Equipment
                    type: website
                -   href: https://www.nifc.gov/resources/equipment/dozers
                    text: Dozers
                    type: website
-   requirement: 9
    text: '<b>Taking Action.</b> Do ONE of the following:'
    children:
        -   requirement: a
            text: |-
                Develop a fire readiness plan for a wildland area with which you
                are familiar. The plan should include a map showing available
                resources, water supplies, natural and manmade barriers, and
                access. The plan should discuss fuel loads, available fire
                apparatus, structure protection needs, values at risk, medical
                and evacuation considerations and potential fire suppression
                tactics.
        -   requirement: b
            text: |-
                Visit with a state or federal forestry official or your local
                fire warden. Discuss the causes of and types of wildland fire
                that occur in your area. Discuss the prime fire season(s) in
                your area. Identify the agency responsible for wildland fire
                suppression in your area. Discuss what you learned with your
                counselor.
        -   requirement: c
            text: |-
                Conduct a Firewise assessment of a home or a building in the
                wildland-urban interface, which could include a Scout camp
                building or facility. Identify potential risks and fire hazards.
                With your counselor's approval, complete a project to reduce the
                wildfire risk and increase the preparedness of the building.
                Write a brief report about what you did and learned from the
                assessment and project.
            resources:
                -   href: >-
                        https://www.nfpa.org/en/education-and-research/wildfire/preparing-homes-for-wildfire
                    text: Firewise USA®
                    type: website
                -   href: >-
                        https://dem.ri.gov/sites/g/files/xkgbur861/files/programs/bnatres/forest/pdf/fire/fire-home-assessment-form.pdf
                    text: Fire Home Assessment
                    type: pdf
        -   requirement: d
            text: |-
                Meet with a Fire Prevention Specialist or a local fire official
                to learn about fire prevention efforts in your community. From
                what you learned, prepare a fire prevention message (skit,
                video, or billboard concept) and share with your counselor and
                troop (or other group approved by your counselor).
        -   requirement: e
            text: |-
                Meet with a meteorologist or someone familiar with fire weather
                and discuss the fire weather concerns and typical fire seasons
                that exist in your area. Discuss the conditions that lead to a
                Fire Weather Watch or a Red Flag Warning. Discuss what you
                learned with your counselor.
-   requirement: 10
    text: |-
        <b>Apply Your Learning to a Real Event.</b> Research an historic
        catastrophic wildland fire incident that occurred in the United States.
        Discuss with your counselor and/or your troop or a group approved by
        your counselor the conditions that led to the incident, how the incident
        was managed, and how the incident could have been prevented. Explain
        what lessons were learned and how this incident affected future fire
        suppression policy or suppression tactics.
    resources:
        -   href: https://youtu.be/LatzdMh49ps
            text: The Tillamook Burn Forest Fire of August, 1933
            type: video
        -   href: https://youtu.be/CAgP9fo3f7s
            text: The Story Behind the Yellowstone Fires of 1988
            type: video
        -   href: https://youtu.be/uKJdfYijVvQ
            text: The Smoke Jumper Tragedy of Mann Gulch
            type: video
        -   href: https://youtu.be/7UVaFKnN-gI
            text: Storm King Mountain Tragedy
            type: video
-   requirement: 11
    text: |-
        <b>Careers in Wildland Fire Management.</b> Explore careers related to
        this merit badge. Research one career to learn about the training and
        education needed, costs, job prospects, salary, job duties, and career
        advancement. Your research methods may include-with your parent or
        guardian's permission-an internet or library search, an interview with a
        professional in the field, or a visit to a location where people in this
        career work. Discuss with your counselor both your findings and what
        about this profession might make it an interesting career.
    resources:
        -   href: https://youtu.be/55iglSp3ki0
            text: Wildland Firefighting &amp; Wildland Fire Ecology Jobs
            type: video
        -   href: https://careers.iafc.org/career/fire-management-specialist
            text: Fire Management Specialist
            type: website
        -   href: https://youtu.be/ewR1Ryqvr2Y
            text: The Forest Service's Wildfire Force
            type: video
