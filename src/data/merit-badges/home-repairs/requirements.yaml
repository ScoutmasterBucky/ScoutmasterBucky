            text: Replace an electrical cord or repair a plug or lamp socket.
            resources:
                -   href: https://youtu.be/SsvPe1bo2Qs
                    text: How To Replace a Lamp Cord
                    type: video
        -   requirement: c
            text: Install a single-pole light switch.
        -   requirement: d
            text: Replace an electrical wall outlet.
            resources:
                -   href: https://www.homedepot.com/c/ah/how-to-replace-an-electrical-outlet/9ba683603be9fa5395fab908943e20a
