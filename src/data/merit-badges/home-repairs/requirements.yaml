# Changed note to only bold "NOTE:"
-   text: |-
        <i><b>NOTE:</b> A parent, guardian, or the counselor may supervise the
        Scout's work on any Home Repairs requirements.</i>
-   requirement: 1
    text: 'Do the following:'
    children:
        -   requirement: a
            text: |-
                Explain to your counselor the most likely hazards you may
                encounter while working on home repairs and what you should do
                to anticipate, mitigate, prevent, and respond to these hazards.
                Describe the appropriate safety gear and clothing that should be
                used when working on home repairs.
            resources:
                -   href: https://www.homedepot.com/c/ab/what-is-ppe-and-why-is-it-important
                    text: What Is PPE and Why Is It Important
                    type: website w/ video
                -   href: https://www.homedepot.com/c/ab/ladder-safety-tips/9ba683603be9fa5395fab9017d77401c
                    text: Ladder Safety Tips
                    type: website
        -   requirement: b
            text: |-
                Discuss general precautions related to home repairs. Name at
                least 10 safe practices that every home repairer should
                exercise.
            resources:
                -   href: https://www.youtube.com/shorts/BVCmz9KnwWk
                    text: 10 Rules for Safety
                    type: video
-   requirement: 2
    text: |-
        Under the supervision of your parent, guardian, or counselor, do THREE
        of the following:
    children:
        -   requirement: a
            text: |-
                Maintain or recondition a yard tool and show that you know how
                to clean up and properly store this equipment.
            resources:
                -   href: https://youtu.be/6EMseAAMpRY
                    text: How To Remove Rust From Tools
                    type: video
        -   requirement: b
            text: Weatherstrip a window or door.
            resources:
                -   href: https://youtu.be/OWjBi-QF10w
                    text: Front Door Weather Stripping
                    type: video
        -   requirement: c
            text: Caulk cracks or joints open to the weather.
            resources:
                -   href: https://www.stesso.com/watch/what-most-people-forget-to-caulk-before-painting-their-house-v40873806
                    text: |-
                        What Most People Forget to Caulk Before Painting Their
                        House
                    type: video
                -   href: https://www.homedepot.com/c/ah/how-to-use-a-caulk-gun/9ba683603be9fa5395fab9014749e39b
                    text: How To Use a Caulk Gun
                    type: website
        -   requirement: d
            text: Repair a break in a concrete or asphalt surface.
            resources:
                -   href: https://www.homedepot.com/c/ah/how-to-fix-cracks-in-concrete/9ba683603be9fa5395fab90147c3431e
                    text: How To Fix Cracks in Concrete
                    type: website w/ video
        -   requirement: e
            text: Repair or replace the screen in a window or door.
            resources:
                -   href: https://www.homedepot.com/c/ah/how-to-replace-a-screen-in-a-wooden-frame/9ba683603be9fa5395fab90130d654a
                    text: How to Replace a Screen in a Frame
                    type: website
                -   href: https://youtu.be/Co8G2PAymR4
                    text: How To Make a Window Screen
                    type: video
        -   requirement: f
            text: Replace a pane of glass.
            resources:
                -   href: https://youtu.be/Dc67opK57sk
                    text: How to Replace a Broken Window Pane
                    type: video
