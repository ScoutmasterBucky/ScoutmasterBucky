                    type: video
-   requirement: 4
    text: |-
        Under the supervision of your parent, guardian, or counselor, do TWO of
        the following:
    children:
        -   requirement: a
            text: |-
                Locate a main electrical switch box and know how to replace a
                fuse or reset a circuit breaker.
            resources:
                -   href: https://www.youtube.com/watch?v=bHQMCovwwAo
                    text: How to Replace Fuses and Reset Breakers
