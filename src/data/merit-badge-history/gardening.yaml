-   q: Was Gardening one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Gardening in 1911?
    a: Dig and care for during the season a piece of ground containing not less than 144 square feet.
-   q: Of the years with a known count, when did Scouts earn the most Gardening merit badges?
