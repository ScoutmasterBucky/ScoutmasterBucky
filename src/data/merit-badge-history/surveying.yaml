-   q: Was the Surveying badge made in every patch style of its time?
    a: No. No Type I Surveying badge is known to exist.
-   q: Was Surveying one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Surveying in 1911?
    a: Map correctly from the country itself the main features of half a mile of road, with 440 yards each side to a scale of two feet to the mile, and afterward draw same map from memory.
-   q: Of the years with a known count, when did Scouts earn the most Surveying merit badges?
