thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
    - Map correctly from the country itself the main features of half a mile of road, with 440 yards each side to a scale of two feet to the mile, and afterward draw same map from memory.
    - Be able to measure the height of a tree, telegraph pole, and church steeple, describing method adopted.
    - Measure width of a river.
    - Estimate distance apart of two objects a known distance away and unapproachable.
    - Be able to measure a gradient.
