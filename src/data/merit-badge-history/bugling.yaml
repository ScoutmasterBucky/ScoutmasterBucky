-   q: Was the Bugling badge made in every patch style of its time?
    a: No. No Type D or I Bugling badge is known to exist.
-   q: Was Bugling one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Bugling in 1911?
    a: Be able to sound properly on the Bugle the customary United States Army calls.
-   q: Of the years with a known count, when did Scouts earn the most Bugling merit badges?
