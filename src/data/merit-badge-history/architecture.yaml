trivia:
-   q: Was the Architecture badge made in every patch style of its time?
    a: No. No Type D Architecture badge is known to exist.
-   q: Was Architecture one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Architecture in 1911?
    a: Present a satisfactory free-hand drawing.
-   q: Of the years with a known count, when did Scouts earn the most Architecture merit badges?
    a: 1976, when 8,658 were earned.
- {q: 'How many Architecture merit badges had been earned by 2020?', a: '237,322.'}
-   q: What was Architecture's best year in the rankings on record?
    a: 1912, when it was 41st of the 51 merit badges earned that year.
