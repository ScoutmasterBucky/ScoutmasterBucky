trivia:
-   q: Was the Cycling badge made in every patch style of its time?
    a: No. No Type I Cycling badge is known to exist.
-   q: Was Cycling one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Cycling in 1911?
    a: Be able to ride a bicycle fifty miles in ten hours.
-   q: Of the years with a known count, when did Scouts earn the most Cycling merit badges?
    a: 1973, when 12,867 were earned.
- {q: 'How many Cycling merit badges had been earned by 2020?', a: '610,301.'}
-   q: What was Cycling's best year in the rankings on record?
    a: 1911, when it was 5th of the 22 merit badges earned that year.
