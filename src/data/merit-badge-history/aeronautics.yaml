# Aeronautics merit badge history. Approved by Bucky on 2026-10-23; the
# generator no longer overwrites this file (its printings still come from the
# workbook). Story text is Bucky's own from his earlier page.

name: Aeronautics
precededBy: Aviation
precededByLink: aviation
introduced: 1942
discontinued: '1952'
replacedWith: Aviation
story: ['The Aeronautics merit badge utilized the suspended Aviation merit badge design for its design. After the four "Air Scouts" specific badges were dissolved in 1951-1952, the Aviation merit badge
        was brought back and used the latest rendition of the Aeronautics merit badge design.']

# Requirements still needed. The archived meritbadge.org wiki shows Airplane
# Design's requirements on its Aeronautics page too; Boys' Life (October 1942,
# page 27) shows that list (wing camber, stability) is Airplane Design's.
# Bucky's 1942 Aeronautics pamphlet is the best source (see TODO.md).

# Researched trivia, each fact from at least two sources or from Bucky's own
# records; the last two come from the page's own data
trivia:
    - q: Which Air Scout rank called for the Aeronautics merit badge?
      a: Observer, the second of the four Air Scout ranks (Apprentice, Observer, Craftsman and Ace), in the 1943 Air Scout Manual.
    - q: Where did the 1942 Aeronautics pamphlet come from?
      a: It was the old Aviation pamphlet, completely rewritten for the new Air Scout program, covering the basics of flight, model building, engines and how to identify aircraft.
    - q: What did the Aviation merit badge look like when it returned in 1952?
      a: It used the latest version of the Aeronautics badge design.
    - q: Was the Aeronautics badge made in every patch style of its time?
      a: No. Like the other Air Scout badges, it kept its blue Type C design through 1946, and no Type D Aeronautics badge is known to exist.
    - q: In what year did Scouts earn the most Aeronautics merit badges?
      a: 1943, when 3,590 were earned.

