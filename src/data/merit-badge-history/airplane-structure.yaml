trivia:
-   q: Which of the four Air Scout badges is known in the tan Type D style?
    a: Only Airplane Structure. Aerodynamics, Aeronautics and Airplane Design are known only in their blue Type C design through 1946.
-   q: What did a Scout earn by completing Airplane Structure and Weather in 1942?
    a: The triple-bladed propeller insignia of the Second Class Air Scout Candidate.
-   q: What did the 1942 Airplane Structure pamphlet teach?
    a: The major parts of an airplane, how to build working and flying model planes, and how the controls work, shown with a "joy stick" model.
- {q: 'What was the highest Air Scout rank?', a: 'Ace, above Apprentice, Observer and Craftsman.'}
-   q: How did Airplane Structure compare with the other Air Scout badges?
    a: With 12,130 earned, it was second only to Aeronautics among the four.
