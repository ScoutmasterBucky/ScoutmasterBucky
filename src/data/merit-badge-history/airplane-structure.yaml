story: ['The "Air Scouts" program, established in 1941, offered the Ace Award as its highest program level recognition. Despite lower membership numbers, the Ace Award maintained a similar consistency to
        its program equivalent; the standard Boy Scouts program and the Eagle Scout award, at around 3 to 4 percent of all potential members receiving the award.']
