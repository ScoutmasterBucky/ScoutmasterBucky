# Hard cover (library binding) types, for the hard cover type pages.
# Descriptions are Scoutmaster Bucky's own, from his earlier site (typos fixed).
# Years come from the Hard Cover Types sheet of his pamphlet workbook.
# `titles` are the titles he has confirmed in each type; badges with a history
# page are linked automatically.
HCA:
    name: Plain bound covers
    contents: Types 3, 4 and 5
    text: >-
        Hard Cover Type HCA is a category, but it has yet to be determined whether there are subcategories, let alone whether this is an actual printing of hard cover library copies done by the Boy Scouts of America. These are most likely "homemade" or "library-made" variations. Libraries may have had their own binding process for pamphlet-type books or for repairing damaged books of the time, and these merit badge pamphlets were the lucky recipients of a "professional" hand-made hard cover. Each book in this category is distinctly different from the others, with different color coverings, different size, positioning, color and style of font, and different binding and stitching. This type of cover seems to be exclusive to the Type 3, 4 and 5 plain bound hard covers. If this was an official binding provided by the Boy Scouts of America, no printings beyond the mid-1940s are found in this style; later pamphlet printing dates are likely true "homemade" bindings. These very well could have been done by Boy Scouts themselves and donated to the library.
    titles: [Civics, Aerodynamics, Cooking, Public Health, Cement Work, Athletics, Personal Health]
HCB:
    name: Scout in short pants, khaki title
    contents: Types 3 and 4
    years: 1940-1942
    front: /history/0-type/hardcover-hcb-front.webp
    back: /history/0-type/hardcover-hcb-back.webp
    text: >-
        Hard Cover Type HCB is distinguished by the Boy Scout in short pants with a campaign hat on and his arms bent with his hands behind his back. The left side of the cover is khaki tan and the right side red, with the words BOY SCOUTS OF AMERICA in capital letters in the same khaki color as the left side. The title is in black. HCB covers come with two types of pamphlets, Type 3 and Type 4, and span 1940 to 1942.
    titles: [Taxidermy, Athletics, Bird Study, Cooking, Electricity, Farm Layout and Building Arrangement, Fingerprinting, Leathercraft, Pathfinding, Personal Health, Physical Development, Radio, Reptile Study, Rocks and Minerals, Salesmanship, Signaling, Weather, Zoology]
HCC:
    name: Scout in short pants, black lettering
    contents: Types 3, 4 and 5
    years: 1943-1945
    front: /history/0-type/hardcover-hcc-front.webp
    back: /history/0-type/hardcover-hcc-back.webp
    text: >-
        Hard Cover Type HCC is distinguished by the Boy Scout in short pants with a campaign hat on and his arms bent with his hands behind his back. The left side of the cover is khaki tan and the right side red, with the words BOY SCOUTS OF AMERICA in capital letters in black. The title is also in black. HCC covers come with three types of pamphlets, Type 3, Type 4 and Type 5, and span 1943 to 1945.
    titles: [Farm Records, Aerodynamics, Aeronautics, Bee Keeping, Beef Production, Cotton Farming, Hog and Pork Production, Safety, Textiles]
HCD:
    name: Scout in short pants, rust and turquoise
    contents: Type 5
    years: 1943-1945
    front: /history/0-type/hardcover-hcd-front.webp
    back: /history/0-type/hardcover-hcd-back.webp
    text: >-
        Hard Cover Type HCD is distinguished by the Boy Scout in short pants with a campaign hat on and his arms bent with his hands behind his back. The left side of the cover is a rust red and the right side turquoise, with the words BOY SCOUTS OF AMERICA in capital letters in black like the title. HCD covers are not currently known to have any variations and contain Type 5 pamphlets.
    titles: [Basketry, Botany, Canoeing, Landscape Gardening, Mechanical Drawing]
HCE:
    name: Scout in short pants, grayish khaki and turquoise
    contents: Type 5
    years: 1945-1949
    front: /history/0-type/hardcover-hce-front.webp
    back: /history/0-type/hardcover-hce-back.webp
    text: >-
        Hard Cover Type HCE is distinguished by the Boy Scout in short pants with a campaign hat on and his arms bent with his hands behind his back. The left side of the cover is a grayish khaki and the right side turquoise, with the words BOY SCOUTS OF AMERICA in capital letters in black like the title. HCE covers are not currently known to have any variations and contain Type 5 pamphlets.
    titles: [Interpreting, Agriculture, Automobiling, Cotton Farming, Dairying, Fingerprinting, Fruit Culture, Grasses Legumes and Forage Crops, Marksmanship, Salesmanship, Scholarship]
HCF:
    name: Scout in short pants, khaki and teal
    contents: Type 5
    years: 1944-1949
    front: /history/0-type/hardcover-hcf-front.webp
    back: /history/0-type/hardcover-hcf-back.webp
    text: >-
        Hard Cover Type HCF is distinguished by the Boy Scout in short pants with a campaign hat on and his arms bent with his hands behind his back. The left side of the cover is khaki tan and the right side teal, with the words BOY SCOUTS OF AMERICA in capital letters in black like the title. At a glance HCE and HCF covers may look alike, but HCE covers are clearly duller with a grayish khaki, while HCF covers are a vibrant khaki tan with a vivid turquoise-teal on the right side. HCF covers are not currently known to have any variations and contain Type 5 pamphlets, with printing dates between 1944 and 1949.
    titles: [Public Speaking, Aeronautics, Automobiling, Canoeing, Carpentry, Cycling, Home Repairs, Insect Life, Leathercraft, Life Saving, Machinery, Plumbing, Pottery, Safety, Sculpture, Sheep Farming, Wood Carving, Zoology]
HCG:
    name: Scout in long pants, khaki title
    contents: Type 5
    years: '1949'
    front: /history/0-type/hardcover-hcg-front.webp
    back: /history/0-type/hardcover-hcg-back.webp
    text: >-
        Hard Cover Type HCG is distinguished by the Boy Scout in long pants and a long-sleeve shirt with a garrison cap on and his arms at his sides. The left side of the cover is khaki tan and the right side a grayish khaki, with the words BOY SCOUTS OF AMERICA in capital letters in black. The title is in the same or a similar khaki tan as the left side. HCG covers are not currently known to have any variations and contain Type 5 pamphlets, with printing dates predominantly in 1949.
    titles: [Scholarship, Dramatics, Mechanical Drawing]
HCH:
    name: Scout in long pants, pixelated design
    contents: Type 5
    years: 1950-1952
    front: /history/0-type/hardcover-hch-front.webp
    back: /history/0-type/hardcover-hch-back.webp
    text: >-
        Hard Cover Type HCH is distinguished by the Boy Scout in long pants and a long-sleeve shirt with a garrison cap on and his arms at his sides. The left side of the cover is khaki tan and the right side red, with the words BOY SCOUTS OF AMERICA in capital letters in black like the title. HCH covers have a blank back cover and a flat spine and come only with Type 5 pamphlets. The Boy Scout on the front is distinguishably different from later cover types that look very similar: he is drawn with very detailed pixels, and that is what sets this cover type apart.
    titles: [Landscape Gardening, Agriculture, Automobiling, Beef Production, Botany, Business, Canoeing, Carpentry, Cement Work, Cotton Farming, Dairying, Electricity, Farm Home and its Planning, Farm Mechanics, Farm Records and Bookkeeping, Firemanship, Forestry, Foundry Practice, Grasses Legumes and Forage Crops, Hog and Pork Production, Home Repairs, Horsemanship, Interpreting, Machinery, Marksmanship, Masonry, Mechanical Drawing, Metal Work, Music and Bugling, Painting, Plumbing, Pottery, Printing, Rabbit Raising, Reading, Rowing, Salesmanship, Scholarship, Taxidermy, Textiles]
HCI:
    name: Scout in long pants, hard lines
    contents: Types 5 and 6
    years: 1951-1954
    front: /history/0-type/hardcover-hci-front.webp
    back: /history/0-type/hardcover-hci-back.webp
    text: >-
        Hard Cover Type HCI is distinguished by the Boy Scout in long pants and a long-sleeve shirt with a garrison cap on and his arms at his sides. The left side of the cover is khaki tan and the right side red, with the words BOY SCOUTS OF AMERICA in capital letters in black like the title. HCI covers contain Type 5 or 6 pamphlets, with printings from mid-1951 through mid-1954. Both the HCI and HCH versions have a flat spine and a blank back, with oversized capital letters spelling out the title on the spine. The HCI Scout is not pixelated but drawn in hard lines. There are many varieties of the HCI cover, mainly in inconsistent ink, some heavier lined than others.
    titles: [Dramatics, Agriculture, Animal Industry, Archery, Art, Athletics, Bird Study, Canoeing, Cooking, Corn Farming, Cycling, Dairying, Farm Records and Bookkeeping, Fingerprinting, First Aid, Fishing, Forestry, Grasses Legumes and Forage Crops, Hiking, Home Repairs, Indian Lore, Leatherwork, Life Saving, Marksmanship, Nature, Pigeon Raising, Poultry Keeping, Railroading, Reading, Rowing, Salesmanship, Seamanship, Sheep Farming, Stamp Collecting, Swimming, Taxidermy, Zoology]
HCJ:
    name: Follett Duro-Tuff binding, rounded spine
    contents: Type 6
    years: 1953-1964
    front: /history/0-type/hardcover-hcj-front.webp
    back: /history/0-type/hardcover-hcjv1-back.webp
    text: >-
        Hard Cover Type HCJ is distinguished by the Boy Scout in long pants and a long-sleeve shirt with a garrison cap on and his arms at his sides. The left side of the cover is khaki tan and the right side red, with the words BOY SCOUTS OF AMERICA in capital letters in black like the title. HCJ covers are the last with the word "OF" in capital letters. They come in two variations, both with Type 6 pamphlets but with different back cover markings. Variation 1 has FOLLETT DURO-TUFF BINDING printed on the back cover; Variation 2 has a red FDB on the back cover; both have a rounded spine. HCI and HCJ look the same apart from very minor printing differences on the front, so the back cover, contents and spine must be used to tell them apart, and many shading differences will be found. Variation 1 seems confined to printings from mid-1953 to mid-1959, while Variation 2 picks up in 1959 and continues through most of 1963.
    titles: [Dramatics, Agriculture, Animal Industry, Archery, Art, Astronomy, Athletics, Automobiling, Automotive Safety, Aviation, Basketry, Bee Keeping, Beef Production, Bird Study, Bookbinding, Botany, Business, Camping, Canoeing, Chemistry, Citizenship, Coin Collecting, Cooking, Corn Farming, Cotton Farming, Cycling, Dog Care, Electricity, Farm Home and its Planning, Farm Mechanics, Farm Records and Bookkeeping, Fingerprinting, Firemanship, First Aid, Fishing, Forestry, Fruit and Nut Growing, Gardening, Geology, Hog and Pork Production, Home Repairs, Horsemanship, Indian Lore, Insect Life, Journalism, Landscape Gardening, Leatherwork, Life Saving, Machinery, Masonry, Mechanical Drawing, Metal Work, Motorboating, Music and Bugling, Nature, Painting, Personal Fitness, Pets, Photography, Pigeon Raising, Pioneering, Plumbing, Poultry Keeping, Printing, Public Health, Public Speaking, Rabbit Raising, Radio, Railroading, Reading, Reptile Study, Rowing, Safety, Scholarship, Seamanship, Sheep Farming, Signaling, Skiing, Small Grains and Cereal Foods, Soil and Water Conservation, Stamp Collecting, Surveying, Swimming, Textiles, Weather, Wildlife Management, Wood Carving, Wood Work, Zoology]
HCK:
