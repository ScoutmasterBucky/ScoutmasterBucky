    front: /history/0-type/hardcover-hcl-front.webp
    back: /history/0-type/hardcover-hcl-back.webp
    text: >-
        Hard Cover Type HCL is distinguished by the Boy Scout in long pants and a long-sleeve shirt with a garrison cap on and his arms at his sides. The left side of the cover is khaki tan and the right side red, with the words BOY SCOUTS of AMERICA in capital letters except for "of," now lower case, all in black like the title. HCL and HCM covers tend to be a bit lighter in color than earlier types of similar design. HCL covers come in two variations, not in the cover itself but in the contents: Variation 1 contains Type 6 pamphlets and Variation 2 contains Type 7. The back cover has FLB in red with two red dots beneath it, and the spine is flat.
    titles: [Cycling, Agriculture, Archery, Architecture, Art, Astronomy, Athletics, Atomic Energy, Automotive Safety, Aviation, Beef Production, Bird Study, Camping, Canoeing, Citizenship, Coin Collecting, Cooking, Dairying, Dog Care, Electricity, Electronics, Farm Mechanics, Farm Records, Fingerprinting, First Aid, First Aid to Animals, Forage Crops, Forestry, Gardening, Geology, Hiking, Horsemanship, Insect Life, Journalism, Leatherwork, Life Saving, Machinery, Metal Work, Model Design and Building, Motorboating, Music and Bugling, Nature, Oceanography, Painting, Personal Finances, Personal Fitness, Pets, Photography, Pigeon Raising, Plumbing, Pottery, Poultry Keeping, Rabbit Raising, Radio, Railroading, Reading, Rowing, Safety, Salesmanship, Scholarship, Sculpture, Skiing, Small-Boat Sailing, Small Grains, Soil and Water Conservation, Space Exploration, Stamp Collecting, Surveying, Swimming, Textiles, Weather, Wildlife Management, Wood Carving, Wood Work]
HCM:
