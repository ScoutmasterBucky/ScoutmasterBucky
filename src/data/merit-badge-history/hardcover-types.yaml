    contents: Type 7
    years: 1966-1970
    front: /history/0-type/hardcover-hcn-front.webp
    back: /history/0-type/hardcover-hcn-back.webp
    text: >-
        Hard Cover Type HCN is distinguished by the Boy Scout in long pants and a long-sleeve shirt with a garrison cap on and his arms at his sides. The left side of the cover is either a dirty white or a cream color and the right side red, with the words BOY SCOUTS of AMERICA in capital letters except for "of," which is lower case, all in black like the title. Like earlier covers, HCN covers are found in shades from off-white to a more cream color, but these are not distinct enough to classify as variations. Only Type 7 pamphlets are found in HCN hard covers.
    titles: [Atomic Energy, American Business, Automotive Safety, Citizenship, Communications, Cooking, Cycling, Home Repairs, Insect Life, Landscape Architecture, Masonry, Metallurgy, Music, Sculpture, Space Exploration, Surveying, Swimming, Theater]
HCO:
    name: Title on the spine only
    contents: Type 6
    front: /history/0-type/hardcover-hco-front.webp
    back: /history/0-type/hardcover-hco-back.webp
    text: >-
        Hard Cover Type HCO is a less often seen hard cover and was likely short-lived, since the title appears only on the spine. Spine printing colors, fonts and contents vary, and variations cannot yet be worked out from the limited number seen. Until there is more clarity it remains a loosely defined group. Despite the differences in the spine, there are two distinct cover designs: Variation 1 in dark blue ink and Variation 2 in white ink. HCO covers are only known to contain Type 6 pamphlets at this time.
    titles: [Pets, Citizenship, Leatherwork]
HCP:
    name: Red with black box and badge, white fleur-de-lis
    contents: Types 6 and 7
    years: 1961-1970
    front: /history/0-type/hardcover-hcp-front.webp
    back: /history/0-type/hardcover-hcp-back.webp
    text: >-
        Hard Cover Type HCP covers are red with a black box at the top of the front cover. What sets them apart is that the title is shown with a picture of the merit badge itself inside the black box. The fleur-de-lis is in white in the middle of the front cover. Most HCP covers have a flat spine showing just the title in white capital letters, and contain Type 6 or Type 7 pamphlets. A less common version has a rounded spine with "BOY SCOUTS OF AMERICA" along with the title in white; these are designated HCP2 and come only with Type 7 pamphlets.
    titles: [Farm Arrangement, Agriculture, Animal Industry, Archery, Astronomy, Athletics, Bookbinding, Botany, Business, Camping, Canoeing, Cooking, Corn Farming, Cotton Farming, Cycling, Dairying, Dramatics, Electronics, Farm Mechanics, Farm Records, Fingerprinting, Firemanship, First Aid, First Aid to Animals, Fishing, Forage Crops, Forestry, Fruit and Nut Growing, Geology, Home Repairs, Insect Life, Landscaping, Leatherwork, Marksmanship, Metalwork, Motorboating, Nature, Painting, Personal Fitness, Photography, Pigeon Raising, Pioneering, Poultry Keeping, Printing, Public Health, Rabbit Raising, Radio, Railroading, Reading, Reptile Study, Rowing, Salesmanship, Skiing, Small Grains, Soil and Water Conservation, Stamp Collecting, Swimming, Textiles, Wildlife Management, Zoology, Art]
HCQ:
    name: Red with black box, white fleur-de-lis, no badge
    contents: Types 6 and 7
    years: 1965-1966
    front: /history/0-type/hardcover-hcq-front.webp
    back: /history/0-type/hardcover-hcq-back.webp
    text: >-
        Hard Cover Type HCQ covers are red with a black box at the top of the front cover. Unlike HCP, the black box shows only the title in white, with no picture of the merit badge. The fleur-de-lis is in white in the middle of the front cover, and the flat spine shows just the title in white capital letters. HCQ covers are found with both Type 6 and Type 7 pamphlets.
    titles: [Citizenship, Automotive Safety, Scholarship, Stamp Collecting]
HCR:
    name: Red with black box, black fleur-de-lis
    contents: Type 7
    years: 1968-1971
    front: /history/0-type/hardcover-hcr-front.webp
    back: /history/0-type/hardcover-hcr-back.webp
    text: >-
        Hard Cover Type HCR covers are red with a black box at the top of the front cover. Like HCQ, the black box shows only the title in white, with no picture of the merit badge, but the fleur-de-lis in the middle of the front cover is black instead of white. HCR covers are only known with Type 7 pamphlets. The spines are rounded and carry both the title and "BOY SCOUTS OF AMERICA" in white capital letters.
    titles: [Drafting, Bird Study, Farm Records, Firemanship, Model Design and Building, Oceanography, Printing, Public Speaking, Scholarship, Swimming, Theater, Woodwork]
HCS:
    name: Orange, Scout with backpack, badge on green square
    contents: Types 7 and 8
    years: 1970-1973
    front: /history/0-type/hardcover-hcs-front.webp
    back: /history/0-type/hardcover-hcs1-back.webp
    text: >-
        Hard Cover Type HCS is distinguished by its orange cover and a Boy Scout with a backpack in green and red. Near the bottom right corner of the front cover is the title's merit badge on a green square background. HCS covers come in two varieties: Variation 1 contains Type 7 or Type 8 pamphlets and has an "FLB" marking in black on the back cover; Variation 2 contains Type 8 pamphlets and has the "FLB" marking in green.
    titles: [Camping, Astronomy, Athletics, Automotive Safety, Bee Keeping, Botany, Canoeing, Citizenship in the Community, Citizenship in the World, Cooking, Drafting, Emergency Preparedness, Environmental Science, Farm Arrangement, Farm Mechanics, Firemanship, Fish and Wildlife Management, Forage Crops, Fruit and Nut Growing, Gardening, General Science, Home Repairs, Horsemanship, Landscape Architecture, Life Saving, Machinery, Mammals, Masonry, Metals Engineering, Metalwork, Motorboating, Personal Fitness, Personal Management, Pigeon Raising, Pioneering, Public Health, Radio, Rowing, Safety, Salesmanship, Scholarship, Sculpture, Signaling, Skiing, Small-Boat Sailing, Small Grains, Soil and Water Conservation, Space Exploration, Sports, Swimming, Textiles, Theater, Water Skiing, Weather, Wood Carving, Wood Work]
HCT:
    name: Orange, Scout with backpack, no green square
    contents: Type 8
    years: 1973-1978
    front: /history/0-type/hardcover-hct-front.webp
    back: /history/0-type/hardcover-hct-back.webp
    text: >-
        Hard Cover Type HCT is a loosely defined group with many variations, none of which can be singled out. The coloring of the Scout and his uniform varies widely, some very heavy green but most a lighter green, and on a handful of titles the merit badge is smaller than on others. In general, HCT covers have an orange cover and a Boy Scout with a backpack in green and red, with the title's merit badge near the bottom right corner of the front cover. Unlike HCS, the badge has no green square behind it. HCT covers contain Type 8 pamphlets and have the same green FLB marking on the back cover.
    titles: [Dairying, Dentistry, Agriculture, American Business, Animal Industry, Animal Science, Architecture, Astronomy, Automotive Safety, Beef Production, Bird Study, Bookbinding, Canoeing, Citizenship in the Community, Coin Collecting, Consumer Buying, Cooking, Corn Farming, Dog Care, Drafting, Electricity, Emergency Preparedness, Energy, Farm Arrangement, Farm Records, Fish and Wildlife Management, Food Systems, Gardening, General Science, Hiking, Home Repairs, Horsemanship, Indian Lore, Insect Life, Journalism, Landscape Architecture, Law, Leatherwork, Life Saving, Mammals, Metalwork, Model Design and Building, Music, Personal Management, Photography, Plumbing, Public Health, Public Speaking, Rabbit Raising, Reptile Study, Rifle and Shotgun Shooting, Rowing, Safety, Scholarship, Signaling, Small-Boat Sailing, Soil and Water Conservation, Space Exploration, Sports, Stamp Collecting, Textiles, Traffic Safety, Truck Transportation, Wood Work]
HCU:
    name: White cover with collage
    contents: Type 9
    years: 1980-1981
    front: /history/0-type/hardcover-hcu-front.webp
    back: /history/0-type/hardcover-hcu-back.webp
    text: >-
        Hard Cover Type HCU covers are the last known hard covers produced. The white cover shows the face of a Boy Scout amid a color collage of merit badge activities. The only thing that changes from cover to cover is the title printed in black across the top center. HCU covers are known in only one variation and contain Type 9 pamphlets.
    titles: [Archery, Animal Science, Fishing]
# One page for the one-off covers that fit no other type: HCLM, HCLX, HCQQ and
# the covers filed as Misc. Each tile shows the cover's own code.
MISC:
    name: Miscellaneous hard covers
    text: >-
        These hard covers do not fit any of the known types. Some are one-of-a-kind bindings, and others are known from only one or two titles so far, such as the HCLM, HCLX and HCQQ covers. Each is listed with its own code until more examples turn up.
