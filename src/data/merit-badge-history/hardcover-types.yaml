    contents: Type 6
    years: 1962-1965
    front: /history/0-type/hardcover-hck-front.webp
    back: /history/0-type/hardcover-hck-back.webp
    text: >-
        Hard Cover Type HCK is distinguished by the Boy Scout in long pants and a long-sleeve shirt with a garrison cap on and his arms at his sides. The left side of the cover is khaki tan and the right side red, with the words BOY SCOUTS of AMERICA in capital letters except for "of," now lower case, all in black like the title. HCK covers have a red FDB within a circle in the bottom corner of the back cover. The size of the "FDB" varies, with later printings having smaller lettering, but that is not broken out as a separate variation. All HCK covers contain Type 6 pamphlets and span mid-1962 through the end of 1965.
    titles: [Botany, Agriculture, Animal Industry, Art, Astronomy, Automotive Safety, Aviation, Beef Production, Bird Study, Canoeing, Chemistry, Dog Care, Corn Farming, Dairying, Drafting, Electricity, Electronics, First Aid, Fishing, Geology, Hiking, Home Repairs, Horsemanship, Indian Lore, Landscaping, Leatherwork, Life Saving, Machinery, Marksmanship, Motorboating, Music and Bugling, Nature, Painting, Personal Finances, Personal Fitness, Pets, Pioneering, Printing, Public Health, Public Speaking, Radio, Railroading, Reptile Study, Rowing, Safety, Skiing, Small Grains, Soil and Water Conservation, Surveying, Swimming, Textiles, Wildlife Management, Wood Carving, Zoology]
HCL:
