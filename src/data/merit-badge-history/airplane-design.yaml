story: ['The "Air Scouts" program, established in 1941, never really caught on, most likely because of the strict activity restrictions placed on the program, it struggled to compete against the more popular
        and allowing Civil Air Patrol program. Of the four Aviation-themed subjects during this time, the Airplane Design title had the least amount earned in comparison to each of the other three.']
