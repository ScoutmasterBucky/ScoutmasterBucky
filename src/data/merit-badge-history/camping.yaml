thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
    - Have slept in the open or under canvas at different times fifty nights.
    - Have put up a tent alone and ditched it.
    - Have made a bed of wild material and a fire without matches.
    - State how to choose a camp site and how to prepare for rain; how to build a latrine (toilet) and how to dispose of the camp garbage and refuse.
    - Know how to construct a raft.
