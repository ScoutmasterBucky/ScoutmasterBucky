# Zoology merit badge history. Approved by Bucky on 2026-10-25; the
# generator no longer overwrites this file (its printings still come from the
# workbook). Research sources are in history-tools/research/zoology.yaml.

name: Zoology
precededBy: None
introduced: 1930
discontinued: '1972'
replacedWith: General Science, Mammals
story:
- Zoology was added in 1930, the same year as Wood Turning and Landscape Gardening. It sent Scouts outdoors to study wild animal life, but left out birds, snakes and insects, which had merit badges of their own.
- The badge was most popular just before World War II, when 3,599 were earned in 1939. It was discontinued in 1972, after Scouts had earned 64,994 Zoology merit badges.
thenAndNow:
    year: 1942
    source: Handbook for Boys (1940), requirements in effect January 1, 1942, summarized
    requirements:
    - Make five field trips of at least two hours each, if possible in different seasons, to watch wild animals. Keep a record of every animal seen, with the date, place, kind of habitat and what it was doing.
    - Use a classification key to identify at least five animals from different phyla.
    - Learn the life processes all animals share, such as birth, self-protection, feeding and breathing, and keep a record from your own observation of the life cycle and habits of two animals from different phyla.
    - On a map of your area, mark the animals found in each habitat, such as forests, streams and marshes, and learn what your state does to protect wild animals.
    - "For at least three months, do one of these: raise a young animal such as a squirrel, rabbit or guinea pig and keep a weekly diary of its habits, food, weight and health; keep an aquarium or \"toad pen\" and follow frogs, toads, turtles or fish from the egg on; or photograph or sketch microscopic animal life you find and prepare three microscope slides."
