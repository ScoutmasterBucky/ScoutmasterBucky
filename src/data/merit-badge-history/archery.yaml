# Archery merit badge history.
# Image paths are under /public. Leave `image` off when no photo exists yet;
# use `status` to say why: missing (photo needed), unknown (not known to exist),
# none (does not exist in this style), notMade (never printed).
# `more` adds extra photos (variations, backs) shown in the enlarged view.
# Pamphlet printings come from printings/archery.yaml (generated from the workbook).

name: Archery
precededBy: Original badge
introduced: 1911
discontinued: Current
replacedWith: Current

story:
    - Archery is one of the original 57 merit badges. It appeared in the first Official Handbook for Boys in 1911, and its symbol, a bow and arrow, has been on the badge ever since.
    - The first Archery requirements were short and demanding. A Scout had to make his own bow and arrow that would shoot 100 feet "with fair precision," post target scores at 40 and 50 yards, and "shoot so far and fast as to have six arrows in the air at once." Until the first Archery pamphlet appeared in 1920, these requirements were found only in the Scout handbook.
    - For its first forty years the badge was a rarity, earned by a few hundred Scouts a year at most and ranked near the bottom of the list, about 94th of 101 badges through the 1930s. That changed after 1950. Within ten years Scouts were earning more than 5,000 a year, and by 2004 they earned nearly 50,000 Archery badges in a single year. Its best ranking came in 2007, 13th of 122 badges.
    - The arrow on the badge has changed direction over the years. The proper way it points in each era comes from how the badge was pictured in the pamphlets and other Scouting publications of the time. On the early square and wide-crimped badges (Types A and B) the arrow points left. The khaki Type E badges made from 1947 to 1960 point it right, and the Type F badges of the 1960s point it left again. With the fully embroidered Type G badge the design was redrawn on a red background, with the bow lying flat and the arrow crossing it on a diagonal.
    - Archery is primarily earned at Scout camp, where Scouts have a range and equipment to work with. That is why 2020, when most summer camps closed, cut the number earned by two-thirds. Archery remains one of the most popular badges that is not required for Eagle and has ranked 17th of all merit badges every year from 2022 through 2025.

thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
        - Make a bow and arrow which will shoot a distance of one hundred feet with fair precision.
        - Make a total score of 350 with 60 shots in one or two meets, using standard four-foot target at forty yards, or three-foot target at thirty yards.
        - Make a total score of 300 with 72 arrows, using standard target at a distance of fifty yards.
        - Shoot so far and fast as to have six arrows in the air at once.

timeline:
    - { year: 1911, text: One of the 57 original merit badges in the first Official Handbook for Boys. }
    - { year: 1914, text: 'The first two Archery merit badges are earned. None were earned in 1911, 1912 or 1913.' }
    - { year: 1920, text: 'The first Archery merit badge pamphlet (Type 1C) is printed. Until now the requirements were found only in the Scout handbook.' }
    - { year: 1947, text: 'The new khaki Type E badge points the arrow to the right; it points left again from 1961.' }
    - { year: 1952, text: 'Scouts earn 1,398 Archery badges, nearly three times the year before.' }
    - { year: 1969, text: 'The fully embroidered Type G badge brings a new design: a red background with the arrow crossing the bow on a diagonal.' }
    - { year: 1974, text: 'Earned badges jump 46% in one year, to 28,438.' }
    - { year: 2004, text: 'All-time high: 49,626 Archery merit badges earned.' }
    - { year: 2007, text: 'Archery reaches its best ranking ever: 13th of 122 merit badges.' }
    - { year: 2020, text: 'With summer camps closed by the pandemic, only 10,487 are earned, down 67%.' }
    - { year: 2021, text: Camps reopen and Archery climbs to 10th of all merit badges. }
    - { year: 2026, text: 'A 2026 Scouting America edition of the pamphlet (No. 35856) appears. Scouting America is moving pamphlets to PDF, so a printed copy is not yet confirmed.' }

trivia:
    - q: How many arrows did the 1911 requirements ask a Scout to have in the air at once?
      a: Six. The fourth requirement was to "shoot so far and fast as to have six arrows in the air at once."
    - q: When were the first Archery merit badges earned?
      a: In 1914, three years after the badge was created. Only two were earned that year.
    - q: Which way does the arrow point on the Archery badge?
      a: It depends on the year. Left on the Type A and B badges, right on the khaki Type E badges of 1947 to 1960, left again on the Type F badges of the 1960s, and on a diagonal since the red Type G design.
    - q: What was Archery's best year?
      a: '2004, when Scouts earned 49,626 Archery merit badges.'
    - q: Which patch style was Archery never made in?
      a: Type I, the flat-edged "computer designed" style made from 1992 to 1995. Only some badges were produced that way.
    - q: Where was Archery ranked in the 1930s, and where is it now?
      a: Near the bottom, around 94th of 101 badges. Since 2022 it has held steady at 17th of about 140.
    - q: Where does Archery rank among badges that are not required for Eagle?
      a: Third, in both 2022 and 2024, behind Fingerprinting and Rifle Shooting.

