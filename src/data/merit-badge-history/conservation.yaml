name: Conservation
precededBy: Original badge
introduced: 1911
discontinued: '1952'
replacedWith: Wildlife Management
thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
    - Be able to recognize in the forest all important commercial trees in his neighborhood; distinguish the lumber from each and tell for what purpose each is best suited; tell the age of old blazes on
        trees which mark a boundary or trail; recognize the difference in the forest between good and bad logging, giving reasons why one is good and another bad; tell whether a tree is dying from injury
        by fire, by insects, by disease or by a combination of these causes; know what tools to use, and how to fight fires in hilly or in flat country. Collect the seeds of two commercial trees, clean
        and store them, and know how and when to plant them.
    - Know the effect upon stream-flow of the destruction of forests at head waters; know what are the four great uses of water in streams; what causes the pollution of streams, and how it can best be stopped;
        and how, in general, water power is developed.
    - Be able to tell, for a given piece of farm land, whether it is best suited for use as farm or forest, and why; point out examples of erosion, and tell how to stop it; give the reasons why a growing
        crop pointed out to him is successful or why not; and tell what crops should be grown in his neighborhood and why.
    - Know where the great coal fields are situated and whether the use of coal is increasing, and if so at what rate. Tell what are the great sources of waste of coal, in the mines, and in its use, and
        how they can be reduced.
    - 'Know the principal game birds and animals in his neighborhood, the seasons during which they are protected, the methods of protection, and the results. Recognize the track of any two of the following:
        rabbit, fox, deer, squirrel, wild turkey, ruffed grouse and quail.'
