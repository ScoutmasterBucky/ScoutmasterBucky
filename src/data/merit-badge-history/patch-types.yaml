# What each merit badge patch type means. Shared by every history page.
# Written in our own words; `years` are the dates most references agree on.
A:
    name: Square
    years: 1911-1933
    text: Embroidered on tan cloth and cut into squares. The Scout folded the edges under when sewing it on.
B:
    name: Wide border crimped
    years: 1934-1935
    text: The maker folded the edge under and pressed it round, leaving a wide cloth border. Made on depression cloth and heavyweight cloth.
C:
    name: Tan narrow border crimped
    years: 1936-1942
    text: The same crimped edge with a narrow border of about 1/8 inch, on tan cloth.
D:
    name: Fine twill
    years: 1942-1946
    text: Wartime badges on lighter, finer-weave cloth (fine twill and war cloth) while heavier cloth went to the war effort.
E:
    name: Khaki narrow border crimped
    years: 1947-1960
    text: Back to heavier cloth after the war, now in khaki.
F:
    name: Rolled edge twill
    years: 1961-1968
    text: The embroidered border is rolled over the edge instead of crimped, with a gauze backing.
G:
    name: Cloth back
    years: 1961-1971
    text: Fully embroidered with a cloth back. By about 1969 every merit badge was made this way.
H:
    name: Plastic back
    years: 1972-2002
    text: A plastic stiffener on the back. Collectors tell them apart by the back, which can be clear, white, or a very light blue plastic, with waffle-textured and smooth molded versions. These are sorted into variations H1 through H5.
I:
    name: Computer designed
    years: 1993-1995
    text: Flat-edged badges with machine (computer) embroidery and a wider border. Only some badges were made this way.
J:
    name: Scout Stuff back
    years: 2002-2009
    text: The "Scout Stuff" Supply Division logo printed on the back.
K:
    name: BSA 100th anniversary back
    years: 2010-2014
    text: The BSA 2010 anniversary logo printed on the back.
L:
    name: Since 1910 back
    years: 2015-2025
    text: The "Since 1910" logo printed on the back, in large and small logo versions.
M:
    name: Scouting America back
    years: 2025-current
    text: The Scouting America logo printed on the back. Wildland Fire Management and Competitive Gaming, both new in 2026, start with Type M.
