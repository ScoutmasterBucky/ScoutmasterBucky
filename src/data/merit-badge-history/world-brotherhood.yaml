name: World Brotherhood
precededBy: Citizenship
precededByLink: citizenship
introduced: 1952
discontinued: '1972'
replacedWith: Citizenship in the World
story: ['In 1952 the Citizenship merit badge was broken into 4 individual merit badges; Citizenship in the Home, Citizenship in the Community, Citizenship in the Nation, and World Brotherhood, which in 1972
        would eventually turn into Citizenship in the World. These 4 merit badges still utilized the Citizenship merit badge pamphlet until 1972 when they were reorganized into their own subject matters.
        The World Brotherhood is one of the only merit badges that never had its own merit badge pamphlet book exclusively. The World Brotherhood merit badge was redesigned in 1969 to show the Scout sign
        on the badge, until it was morphed into the Citizenship in the World merit badge in 1972.']
