name: Firemanship
precededBy: Original badge
introduced: 1911
discontinued: '1995'
replacedWith: Fire Safety
story: ['In mid-1995, the Firemanship merit badge changed its name to Fire Safety but maintained the same current badge design. The Firemanship / Fire Safety merit badges are maintained as one merit badge
        statistic and the accummulated numbers earned are shown below.']
thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
    - Know how to turn in an alarm for fire.
    - Know how to enter burning buildings.
    - Know how to prevent panics and the spread of fire.
    - Understand the use of hose; unrolling, joining up, connecting two hydrants, use of nozzle, etc.
    - Understand the use of escapes, ladders, and chutes, and know the location of exits in buildings which he frequents.
    - Know how to improvise ropes and nets.
    - Know what to do in case of panic, understand the fireman's lift and drag, and how to work in fumes.
    - Understand the use of fire extinguishers; how to rescue animals; how to save property; how to organize a bucket brigade, and how to aid the police in keeping back crowds.
