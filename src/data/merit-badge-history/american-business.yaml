trivia:
-   q: Which other merit badges were brand new in 1967, along with American Business?
    a: Computers, Engineering, Landscape Architecture and Theater.
-   q: Which merit badge came before American Business?
    a: Business, one of the original 57 badges of 1911. It became American Business in 1967.
-   q: Which merit badge had the second-biggest jump in 2020, after Public Health?
    a: American Business. Scouts earned 4,967, up 238 percent from 1,468 in 2019, as many worked on badges from home.
-   q: Where did American Business rank in 2005 and 2007?
    a: Last, 121st of the 121 merit badges earned in each of those years.
-   q: What idea did the first American Business pamphlet highlight?
    a: Free enterprise, through what it takes to run a small business.
