# Woodwork merit badge history. See archery.yaml for the field notes.

name: Woodwork
precededBy: Craftsmanship
precededByLink: craftsmanship
introduced: 1927
discontinued: Current
replacedWith: Current

story:
    - Woodwork grew out of Craftsmanship, one of the original 1911 merit badges. In 1927 Craftsmanship was split into separate craft badges, Basketry, Bookbinding, Cement Work, Leathercraft, Metalwork, Pottery, Wood Carving, and Woodwork (then written "Wood Work"), each with its own design.
    - The earliest pamphlets came from that Craftsmanship family. Printings from 1920 to 1927 carry the title "Craftsmanship – Wood." The badge that followed was Wood Work, and its symbol was a small stool.
    - In 1952 three badges became one. The January 1952 pamphlet cover reads "Woodwork, replacing Wood Work, Carpentry and Wood Turning merit badges," and it shows a woodworking plane, the symbol the original 1911 Carpentry badge had used. The stool stayed on the patches through Type E; from Type F (1961) on, the badge shows the plane.
    - Carpentry came back for one year only in 2010, as one of four historic badges for Scouting's 100th anniversary.
    - Woodwork was at its most popular during World War II, peaking at 21,589 badges in 1945. By the end of 2020 Scouts had earned 999,863 Woodwork badges, just 137 short of one million.

thenAndNow:
    year: 1911
    badge: Carpentry
    note: Woodwork did not exist yet in 1911. These are the requirements of the original Carpentry badge, the first woodworking merit badge.
    source: The Official Handbook for Boys (1911)
    requirements:
        - Know the proper way to drive, set and clinch a nail.
        - Know the different kinds of chisels, planes and saws, and how to sharpen and use them.
        - Know the use of the rule, square, level, plumb-line and mitre.
        - Know how to use compasses for scribing both regular and irregular lines.
        - Make an article of furniture with three different standard joints or splices, with at least one surface of highly polished hard or decorative wood. All work to be done without assistance.

timeline:
    - { year: 1911, text: Craftsmanship and Carpentry are among the 57 original merit badges. }
    - { year: 1920, text: 'The first "Craftsmanship – Wood" pamphlet (Type 2) is printed.' }
    - { year: 1927, text: Craftsmanship is split into eight craft badges and Woodwork is born. }
    - { year: 1928, text: 'First year of Woodwork counts: 12,680 earned.' }
    - { year: 1930, text: A separate Wood Turning merit badge is added. }
    - { year: 1945, text: 'All-time high: 21,589 Woodwork merit badges earned.' }
    - { year: 1952, text: 'A new Woodwork badge replaces Wood Work, Carpentry and Wood Turning, and takes Carpentry''s plane as its symbol.' }
    - { year: 2010, text: Carpentry returns for one year as a historic badge for Scouting's 100th anniversary. }
    - { year: 2020, text: 'Pandemic year: 3,066 earned, down 32%.' }
    - { year: 2024, text: 'Type 11A cover, the first Woodwork pamphlet with a Scouting America number.' }

trivia:
    - q: How close is Woodwork to one million badges earned?
      a: At the end of 2020 the total stood at 999,863, just 137 short of one million.
    - q: What was on the Woodwork badge before the plane?
      a: A small stool. The plane came from the Carpentry badge when the two were merged in 1952.
    - q: Which three badges did the 1952 Woodwork badge replace?
      a: Wood Work, Carpentry and Wood Turning, as printed on the January 1952 pamphlet cover.
    - q: What happened to the original Carpentry badge?
      a: It was merged into Woodwork in 1952, then brought back for 2010 only as one of four historic merit badges.
    - q: Why do two 1926 printings differ?
      a: Page iv of one ends with the 200 Fifth Avenue address and the other with 2 Park Avenue, as the Boy Scouts' New York address changed.
    - q: When was Woodwork most popular?
      a: '1945, when 21,589 Scouts earned it.'

