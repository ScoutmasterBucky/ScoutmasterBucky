    requirements:
    - Have a list of one hundred different kinds of birds personally observed on exploration in the field.
    - Have identified beyond question, by appearance or by note, forty-five different kinds of birds in one day.
    - Have made a good clear photograph of some wild bird, the bird image to be over one half inch in length on the negative.
