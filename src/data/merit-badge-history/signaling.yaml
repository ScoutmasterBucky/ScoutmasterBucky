trivia:
-   q: Was Signaling one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Signaling in 1911?
    a: 'Send and receive a message in two of the following systems of signaling: Semaphore, Morse, or Myer, not fewer than twenty-four letters per minute.'
-   q: Of the years with a known count, when did Scouts earn the most Signaling merit badges?
    a: 1933, when 2,542 were earned.
- {q: 'How many Signaling merit badges had been earned by 1996?', a: '87,842.'}
-   q: What was Signaling's best year in the rankings on record?
    a: 1911, when it was 7th of the 22 merit badges earned that year.
- {q: 'What replaced Signaling after 1992?', a: Signaling (2010 only).}
