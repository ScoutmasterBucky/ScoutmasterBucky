name: Pathfinding
precededBy: Original badge
introduced: 1911
discontinued: '1952'
replacedWith: None
thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
    - Know every lane, by-path, and short cut for a distance of at least two miles in every direction around the local scouts' headquarters in the country.
    - Have a general knowledge of the district within a five mile radius of his local headquarters, so as to be able to guide people at any time, by day or night.
    - Know the general direction and population of the five principal neighboring towns and be able to give strangers correct directions how to reach them.
    - 'Know in the country in the two mile radius, approximately, the number of horses, cattle, sheep, and pigs owned on the five neighboring farms: or in a town must know in a half-mile radius what livery
        stables, garages and blacksmiths there are.'
    - Know the location of the nearest meat markets, bakeries, groceries, and drug stores.
    - Know where the nearest police station, hospital, doctor, fire alarm, fire hydrant, telegraph and telephone offices, and railroad stations are.
    - Know something of the history of the place, its principal public buildings, such as town or city hall, post-office, schools, and churches.
    - As much as possible of the above information should be entered on a large scale map.
