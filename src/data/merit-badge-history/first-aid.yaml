trivia:
-   q: Was the First Aid badge made in every patch style of its time?
    a: No. No Type I First Aid badge is known to exist.
-   q: Was First Aid one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for First Aid in 1911?
    a: Be able to demonstrate the Sylvester and Schaefer methods of resuscitation.
-   q: Of the years with a known count, when did Scouts earn the most First Aid merit badges?
    a: 1974, when 168,828 were earned.
- {q: 'How many First Aid merit badges had been earned by 2020?', a: '7,370,988.'}
-   q: What was First Aid's best year in the rankings on record?
    a: 1942, when it was 1st of the 110 merit badges earned that year.
