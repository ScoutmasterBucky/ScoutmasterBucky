thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
    - Be able to demonstrate the Sylvester and Schaefer methods of resuscitation.
    - Carry a person down a ladder.
    - Bandage head and ankle.
    - Demonstrate treatment of wound of the neck with severe arterial hemorrhage.
    - Treat mangling injury of the leg without severe hemorrhage.
    - Demonstrate treatment for rupture of varicose veins of the leg with severe hemorrhage.
    - Show treatment for bite of finger by mad dog.
    - Demonstrate rescue of person in contact with electric wire.
    - Apply tourniquet to a principal artery.
    - State chief differences between carbolic poisoning and intoxication.
    - Explain what to do for snake bite.
    - Pass first aid test of American Red Cross Society.
