trivia:
-   q: Agriculture was one of how many farm-related badges among the original 57?
    a: Eight. Agriculture, Bee Farming, Dairying, First Aid to Animals, Forestry, Gardening, Horsemanship and Poultry Farming.
-   q: How big a corn crop did a 1911 Scout have to grow for Agriculture?
    a: At least an acre, and it had to yield 25 percent more than the usual crop.
-   q: What was the "Campbell's Soil Culture" a 1911 Agriculture Scout had to know?
    a: Hardy W. Campbell's dry-farming system for growing crops with little rain, using deep plowing, packing the soil and resting fields in summer.
-   q: How long after it was retired did Scouts keep earning Agriculture?
    a: Until 1981, six years after it was retired in 1975, as Scouts finished badges they had already started.
-   q: In what year did Scouts earn the most Agriculture merit badges?
    a: 1973, when 4,130 were earned, just two years before it was retired.
