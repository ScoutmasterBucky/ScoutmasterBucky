- {year: 1924, text: 'Best ranking: 35th of 64 merit badges.'}
- {year: 1973, text: 'All-time high: 4,130 Agriculture merit badges earned.'}
-   year: 1975
    text: Last year the Agriculture merit badge is offered; it is replaced by Animal Science and Plant Science.
