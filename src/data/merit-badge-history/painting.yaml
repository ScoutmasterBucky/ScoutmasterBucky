thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
    - Have knowledge of how to combine pigments in order to produce paints in shades and tints of color.
    - Know how to add positive colors to a base of white lead or of white zinc.
    - Understand the mixing of oils; turpentine, etc., to the proper consistency.
    - Paint a porch floor or other surface evenly and without laps.
    - Know how and when to putty up nail holes and uneven surfaces.
    - Present for inspection a panel covered with three coats of paint, which panel must contain a border of molding, the body of the panel to be painted in one color and the molding in another.
