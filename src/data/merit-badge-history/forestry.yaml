    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Forestry in 1911?
    a: Be able to identify twenty-five kinds of trees when in leaf, or fifteen kinds of deciduous (broad leaf) trees in winter, and tell some of the uses of each.
-   q: Of the years with a known count, when did Scouts earn the most Forestry merit badges?
