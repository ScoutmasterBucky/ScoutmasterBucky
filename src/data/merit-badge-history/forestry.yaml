    requirements:
    - Be able to identify twenty-five kinds of trees when in leaf, or fifteen kinds of deciduous (broad leaf) trees in winter, and tell some of the uses of each.
    - Identify twelve kinds of shrubs.
    - Collect and identify samples of ten kinds of wood and be able to tell some of their uses.
    - Determine the height, and estimate the amount of timber, approximately, in five trees of different sizes.
    - State laws for transplanting, grafting, spraying, and protecting trees.
