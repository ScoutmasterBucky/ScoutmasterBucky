# Agribusiness merit badge history. Approved by Bucky on 2026-10-23; the
# generator no longer overwrites this file (its printings still come from the
# workbook). Story text is Bucky's own from his earlier page.

name: Agribusiness
precededBy: Farm and Ranch Management Food Systems
introduced: 1987
discontinued: '1995'
# Terry 2013 (Journal of Agricultural Education) says it merged into American
# Business, but that is the only source, and Bucky is not convinced (2026-10-23)
replacedWith: None
story: [The Agribusiness merit badge was short-lived and is one of the shortest run merit badge titles as well as total earned during its tenure in the merit badge offerings. Agribusiness was introduced
        along with 5 other merit badges in 1987; the first new offerings since 1982 (Backpacking).]

# No Agribusiness requirements found online yet; Bucky's 1987 pamphlet is the
# best source. Researched trivia: the 1987 badges and numbers come from
# usscouts.org and Bucky's old page; the American Business merger from Terry,
# "Development and Evolution of Agriculturally Related Merit Badges",
# Journal of Agricultural Education, 2013 (which also gives the 6,716 total).
trivia:
    - q: Agribusiness was one of how many brand-new merit badges in 1987?
      a: Six. It was introduced with American Labor, Graphic Arts, Rifle Shooting, Shotgun Shooting and Whitewater, the first new badges since Backpacking in 1982.
    - q: What number did the BSA give Agribusiness?
      a: '120, the first of the six numbers (120 to 125) given to the new 1987 badges.'
    - q: How many Agribusiness merit badges were earned in its short life?
      a: 6,716 in all, one of the smallest totals of any merit badge.
    - q: Was the Agribusiness badge made in every patch style of its time?
      a: No. No Type I Agribusiness badge is known to exist.

