thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
    - Draw in outline two simple objects, one composed of straight lines, and one of curved lines, the two subjects to be grouped together a little below the eye.
    - Draw in outline two books a little below the eye, one book to be open; also a table or chair.
    - Make in outline an Egyptian ornament.
    - Make in outline a Greek or Renaissance ornament from a cast or copy.
    - Make an original arrangement or design using some detail of ornament.
    - Make a drawing from a group of two objects placed a little below the eye and show light and shade.
    - Draw a cylindrical object and a rectangular object, grouped together a little below the eye, and show light and shade.
    - Present a camp scene in color.
