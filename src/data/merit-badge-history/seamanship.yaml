thenAndNow:
    year: 1911
    source: The Official Handbook for Boys (1911)
    requirements:
    - Be able to tie rapidly six different knots.
    - Splice ropes.
    - Use a palm and needle.
    - Fling a rope coil.
    - Be able to row, pole, scull, and steer a boat; also bring a boat properly alongside and make fast.
    - Know how to box the compass, read a chart, and show use of parallel rules and dividers.
    - Be able to state direction by the stars and sun.
    - Swim fifty yards with shoes and clothes on.
    - Understand the general working of steam and hydraulic winches, and have a knowledge of weather wisdom and of tides.
