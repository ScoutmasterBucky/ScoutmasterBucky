trivia:
-   q: Was the Athletics badge made in every patch style of its time?
    a: No. No Type I Athletics badge is known to exist.
-   q: Was Athletics one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Athletics in 1911?
    a: Write an acceptable article of not less than five hundred words on how to train for an athletic event.
-   q: Of the years with a known count, when did Scouts earn the most Athletics merit badges?
    a: 1944, when 21,104 were earned.
- {q: 'How many Athletics merit badges had been earned by 2020?', a: '1,081,697.'}
-   q: What was Athletics' best year in the rankings on record?
    a: 1942, when it was 10th of the 110 merit badges earned that year.
