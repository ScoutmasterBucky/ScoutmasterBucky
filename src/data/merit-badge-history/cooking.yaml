trivia:
-   q: Was the Cooking badge made in every patch style of its time?
    a: No. No Type I Cooking badge is known to exist.
-   q: Was Cooking one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Cooking in 1911?
    a: 'Prove his ability to build a fireplace out of stone or sod or logs, light a fire, and cook in the open the following dishes in addition to those required for a first-class scout: Camp stew, two
        vegetables, omelet, rice pudding; know how to mix dough, and bake bread in an oven; be able to make tea, coffee, and cocoa, carve properly and serve correctly to people at the table.'
-   q: Of the years with a known count, when did Scouts earn the most Cooking merit badges?
    a: 1964, when 108,762 were earned.
- {q: 'How many Cooking merit badges had been earned by 2020?', a: '4,648,594.'}
-   q: What was Cooking's best year in the rankings on record?
    a: 1958, when it was 1st of the 101 merit badges earned that year.
