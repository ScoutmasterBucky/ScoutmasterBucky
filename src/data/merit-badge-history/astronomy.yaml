trivia:
-   q: Was the Astronomy badge made in every patch style of its time?
    a: No. No Type D, F or I Astronomy badge is known to exist.
-   q: Was Astronomy one of the original 57 merit badges?
    a: Yes. It was in the first Official Handbook for Boys in 1911.
-   q: What was the first thing a Scout had to do for Astronomy in 1911?
    a: Have a general knowledge of the nature and movements of stars.
-   q: Of the years with a known count, when did Scouts earn the most Astronomy merit badges?
    a: 2003, when 19,113 were earned.
- {q: 'How many Astronomy merit badges had been earned by 2020?', a: '727,495.'}
-   q: What was Astronomy's best year in the rankings on record?
    a: 1911, when it was 6th of the 22 merit badges earned that year.
