story: ['The Stalking merit badge was one of four centennial merit badges that were brought out of retirement and offered in 2010 in celebration of the BSA''s 100-year anniversary. Due to current societal
        negative associations with the word "stalking", the 2010-version was renamed Tracking. While the requirements were the same as a historical Stalking merit badge, there was no printed copy of the
        requirements in pamphlet form.']
