html: |-
    <p>Spend Presidents' Day (Monday, February 15) at The Malt Shop! Registration is now open!</p>
    <p><strong>Cost:</strong> $15 for one class or $25 for both. Registration closes Thursday, February 11 at 10:00 PM.</p>
    <ul>
        <li><strong>Game Design:</strong> 8:30 AM - 1:00 PM</li>
        <li><strong>Chess:</strong> 1:30 PM - 4:00 PM</li>
    </ul>
    <p>Classes are limited to 20 Scouts each. Parents are welcome to stay and hang out.</p>
    <p><strong>Free ice cream!</strong> Each registered Scout receives a coupon for one free ice cream cone with the purchase of another food item.</p>
    <p><strong>Lunch:</strong> Lunch is on your own. The grill opens at 11:00 AM for our group, so Game Design Scouts can eat during the late-morning part of class.</p>
    <p><strong>The Malt Shop menu</strong> (prices subject to change; 3% fee on credit card purchases):</p>
    <ul>
        <li><strong>Burgers</strong> (burger only): Plain Hamburger or Cheeseburger $8.50; Malt Shop Burger $8.75; Jalapeño, Mushroom &amp; Swiss $10.25; BBQ, Bacon Cheddar, Pizza Burger $10.50; Breakfast Burger $10.75</li>
        <li><strong>Sandwiches</strong> (sandwich only): Grilled Cheese $9.25; B.L.T. $9.75; Egg Sandwich $10.50; Fried Chicken Sandwich $10.75</li>
        <li><strong>Sides:</strong> French Fries $4.75 half / $7.25 full; Cheese Curds $9.75; Chicken Tenders, Onion Rings, House Salad $10.75</li>
        <li><strong>Shakes &amp; Malts</strong> $9.75; <strong>Specialty Floats</strong> $8.50; Dirty Sodas (ask for prices)</li>
    </ul>
