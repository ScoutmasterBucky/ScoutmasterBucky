html: |-
    <p>Sustainable Safari's education team teaches this class inside their zoo at Burnsville Center. Scouts meet some of the zoo's reptiles and amphibians up close and learn what sets these animals apart.</p>
    <p>Scouts can complete every requirement at the event except requirement 8, the observation requirement, which will need to be done on your own.</p>
    <p>The cost is $25 per Scout. Space is limited, so every Scout must register ahead of time. Wear your field uniform (Class A) and bring a filled-out blue card along with Parts A and B of your Annual Health and Medical Record. Bringing the workbook and reading the merit badge pamphlet before class are strongly encouraged; both are on the <a href="/merit-badges/reptile-and-amphibian-study/">Reptile and Amphibian Study</a> page. Lunch is not provided.</p>
    <p>Scouts who come without their unit should have an adult chaperone on site. Adult chaperones pay for zoo entry at the event, and family members age 5 and under get in free. After class, Scouts can stay and enjoy the zoo with a complimentary medium feed cup.</p>
