html: |-
    <p>This class draws on Sustainable Safari's veterinary medicine staff and the on-site veterinary clinic at their zoo in Burnsville Center. Scouts get an up-close, hands-on look at how animals are cared for and at the bond between people and animals.</p>
    <p>Scouts can expect to complete the entire merit badge at this event.</p>
    <p>The cost is $25 per Scout. Space is limited, so every Scout must register ahead of time. Wear your field uniform (Class A) and bring a filled-out blue card along with Parts A and B of your Annual Health and Medical Record. Bringing the workbook and reading the merit badge pamphlet before class are strongly encouraged; both are on the <a href="/merit-badges/veterinary-medicine/">Veterinary Medicine</a> page. Lunch is not provided.</p>
    <p>Scouts who come without their unit should have an adult chaperone on site. Adult chaperones pay for zoo entry at the event, and family members age 5 and under get in free. After class, Scouts can stay and enjoy the zoo with a complimentary medium feed cup.</p>
