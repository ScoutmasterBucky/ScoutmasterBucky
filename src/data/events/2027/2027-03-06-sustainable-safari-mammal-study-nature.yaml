html: |-
    <p>Two merit badges in one session. Sustainable Safari's education team teaches this class inside their zoo at Burnsville Center. Scouts get hands-on time with the zoo's mammals (a porcupine and a tamandua are among the animals you could meet) while learning how mammals are classified and how everything in nature is connected.</p>
    <p>Scouts can complete every requirement at the event except Mammal Study requirements 3 and 5 and Nature requirement 4, which will need to be done on your own. There is a break from 11:30 am to 12:00 pm.</p>
    <p>The cost is $25 per Scout. Space is limited, so every Scout must register ahead of time. Wear your field uniform (Class A) and bring a filled-out blue card along with Parts A and B of your Annual Health and Medical Record. Bringing the workbook and reading the merit badge pamphlet before class are strongly encouraged; both are on the <a href="/merit-badges/mammal-study/">Mammal Study</a> and <a href="/merit-badges/nature/">Nature</a> pages. Lunch is not provided.</p>
    <p>Scouts who come without their unit should have an adult chaperone on site. Adult chaperones pay for zoo entry at the event, and family members age 5 and under get in free. After class, Scouts can stay and enjoy the zoo with a complimentary medium feed cup.</p>
