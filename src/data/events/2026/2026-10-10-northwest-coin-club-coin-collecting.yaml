html: |-
    <p>The Northwest Coin Club hosts this one day class during their semi-annual NWCC Money Show. Check in begins at 8:30 am and the class runs from 9:00 am until between 1:30 and 2:00 pm. Scouts bring their own worksheets and a pencil, completed as far as they can beforehand. There are coins you will need in order to finish requirement 4, and you will have time during the session to visit the show, so bring money to buy them. Every Scout leaves with a current Kennedy half dollar. Merit badge books are available if you request one ahead of time. If all goes as planned, Scouts should complete the merit badge that day.</p>
    <p>Registration is required and is limited to 50 Scouts. Register by email through the <a href="https://www.northwestcoinclub.com/scouts-merit-badges.html">Northwest Coin Club's Scouts page</a> with each Scout's name, troop number, and an emergency contact and phone number for the day of the class. Registration must be completed before 8:30 am Saturday. The cost is $5.00 per Scout, with checks sent to George Ross, 4023 Hubbard Ave N, Robbinsdale, MN 55422. Contact George Ross at 763-242-1591 with questions.</p>
