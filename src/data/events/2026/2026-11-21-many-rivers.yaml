html: |-
    <p>Arrival is 8:15 am to 8:45 am, followed by flags and announcements. Morning classes are 9:00 am to noon, lunch is staggered by class, and afternoon classes are 1:00 pm to 4:00 pm. Most classes have prerequisites to finish before the event; check the flyer for details.</p>

    <p>Cost is $15 for scouts, which covers classes, lunch, and an event patch. Parents are $10 for lunch. Unit leaders supporting their units are free but should still register. Free adult training sessions, including Merit Badge Counselor Training, run throughout the day.</p>

    <p>More information: <a href="https://drive.google.com/file/d/1Vn2wNkvcnYUy7idamLK4S-SDlxUyHCld/view">Event details and flyer</a> and <a href="https://www.manyriversdistrict.org/merit-badge-events">Many Rivers District - Merit Badge Events</a></p>
