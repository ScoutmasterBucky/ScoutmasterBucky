html: |-
    <p>Check-in runs from 7:00 am to 8:00 am, with an opening assembly at 8:00 am. Morning classes are 8:35 am to 11:30 am and afternoon classes are 1:00 pm to 4:00 pm. Attendees must bring their own lunch.</p>

    <p>Most classes have prerequisites to finish before the rally, and some require a signed parent waiver. Registration closes October 16, 2026.</p>

    <p>More information: <a href="https://scoutinggamehaven.org/event-flyers/mb-rally-10-24-2026/">Gamehaven Council - Fall Merit Badge Rally classes, prerequisites, and waivers</a></p>
