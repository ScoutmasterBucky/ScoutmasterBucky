# Weekly Scouting poll shown on the home page, right below the news.
#
# Each entry starts on its Monday (America/Chicago) and runs until the next
# entry's Monday. Keep the weeks in order, one per Monday, 3 to 6 options each.
# "fact" is optional: a short, true fun fact shown after someone votes.
#
# Never reorder or reword the options of a week that has already started:
# votes are counted by option position.
#
# The build prints a warning (and the Monday watch reports it) when fewer than
# four weeks of questions are left, so new ones can be added in time.

- week: '2026-10-26'
  question: What is the best campfire treat?
  options:
      - S'mores
      - Banana boats
      - Dutch oven cobbler
      - Pie iron pies
      - Popcorn over the fire

- week: '2026-11-02'
  question: Which knot do you trust the most?
  options:
      - Bowline
      - Square knot
      - Taut-line hitch
      - Clove hitch
      - Two half hitches
  fact: The bowline is often called the "king of knots" because it makes a loop that will not slip or jam.

