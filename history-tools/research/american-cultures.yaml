trivia:
    - q: What was the only new merit badge of 1979?
      a: American Cultures.
    - q: Has the American Cultures badge design ever changed?
      a: No. It has kept the same design since 1979, through every patch style from Type H to the new Scouting America back.
    - q: How many American Cultures merit badges were earned in its first year?
      a: 161 in 1979. Two years later, Scouts earned 928.
    - q: Of the years with a known count, when did Scouts earn the most American Cultures merit badges?
      a: 2019, when 3,089 were earned.
    - q: What was American Cultures' best year in the rankings on record?
      a: 2013, when it was 83rd of the 129 merit badges earned that year.
