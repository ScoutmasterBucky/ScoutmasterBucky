# Requirements: Revised Handbook for Boys, 33rd printing, copyright 1940 (Internet
#   Archive boyscoutsofameri0000unse), p. 638: "Wood Work", two requirements
#   (a small piece of furniture with mortise-and-tenon or dowel joints, and its
#   plans). Not marked as revised, unlike Zoology on the next page. The 1927
#   originals weren't found online. Summarized because 1940 is under copyright.
#   Replaces the 1911 Carpentry list the page used to show, since Carpentry has
#   its own page.
