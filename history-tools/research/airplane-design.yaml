# Researched for the Airplane Design history page (generate_histories.py merges
# this over the generated draft). Sources:
# - Handbook for Boys, 1948, as preserved on the archived meritbadge.org wiki
#   (its Airplane Design page; the wiki also pasted this list onto Aeronautics)
# - Boys' Life, October 1942, page 27 (Google Books, full view): the new 1942
#   pamphlets; it confirms this list (wing camber, stability) is Airplane Design's
# - seniorscoutinghistory.org: 1943 Air Scout Manual (Craftsman rank) and the
#   Air Scouting candidate requirements (First Class Air Scout Candidate)
# - Bucky's old page and workbook counts: least earned of the four Air Scout badges

# Summarized in our own words (the original text is still under copyright)
thenAndNow:
    year: 1948
    source: Handbook for Boys (1948), summarized
    requirements:
        - Using rough diagrams or photos, point out how full-size planes are designed differently for five quite different jobs, such as training, airline transport, seaplanes, flying boats and fighters.
        - Measure the outlines of five modern planes and record how much they vary in the ratio of wingspan to wing width (aspect ratio), and in wing area compared with tail area.
        - With rough sketches, show how the curve of a wing (camber) differs for high lift and for high speed, and why.
        - Find the approximate center of gravity of a flying model and explain why a low center of gravity helps stability, and tell what a balanced model would do in flight if longer, heavier wings were put on at the same points.
        - With rough sketches, show why dihedral, swept-back wings and high wings help make a model stable.
        - Build, test and report on two flying models of about the same size but very different design, using the same motor and propeller. A Scout could build one and compare it with a friend's.
        - Make rough scale drawings of the two test models and point out how their designs differ.
        - Fly one or more of your own models in a competition of at least four planes.
        - Measure four of the competition models and give the counselor their flight records, wing shapes and design ratios, such as wingspan to wing width, wingspan to propeller size and wing loading.

trivia:
    - q: Which of the four Air Scout merit badges was earned the least?
      a: Airplane Design, with 5,938 in all, fewer than Aerodynamics, Aeronautics or Airplane Structure.
    - q: Who was the 1942 Airplane Design pamphlet written for?
      a: Experienced model builders who were ready to try designs of their own.
    - q: Which Air Scout rank called for the Airplane Design merit badge?
      a: Craftsman, the third of the four Air Scout ranks (Apprentice, Observer, Craftsman and Ace), in the 1943 Air Scout Manual.
    - q: How many planes had to be in the model competition for Airplane Design?
      a: At least four, and the Scout then measured and compared them.
    - q: Was the Airplane Design badge made in every patch style of its time?
      a: No. Like the other Air Scout badges, it kept its blue Type C design through 1946, and no Type D Airplane Design badge is known to exist.
